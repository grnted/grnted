<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 619" width="520" height="619" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums"><title id="chart-title">Blind test: share of the 474 planted failures each checker found</title><desc id="chart-desc">Blind test: share of the 474 planted failures each checker found. Two brand-new sites we had never trained on, 59 pages, the same pages and one rule for every checker. Granted 71.1% (337 of 474), QualWeb 37.6% (178 of 474), IBM Equal Access 36.7% (174 of 474), Lighthouse 34.8% (165 of 474), Siteimprove Alfa 30.6% (145 of 474), axe-core 30.4% (144 of 474), Pa11y (axe runner) 20.3% (96 of 474), Pa11y (HTML_CodeSniffer runner) 18.4% (87 of 474).</desc><text font-size="21" font-weight="700" fill="#f2f2f5"><tspan x="0" y="21">Blind test: share of the 474 planted</tspan><tspan x="0" y="48">failures each checker found</tspan></text><text font-size="17" fill="#c4c4cc"><tspan x="0" y="75">Two brand-new sites we had never trained on, 59 pages,</tspan><tspan x="0" y="98">the same pages and one rule for every checker.</tspan></text><g data-tool="granted" data-found="337" data-of="474" data-pct="71.1"><text x="0" y="147" font-size="19" font-weight="700" fill="#f2f2f5">Granted</text><text x="520" y="147" text-anchor="end" fill="#f2f2f5"><tspan font-size="19" font-weight="700">71.1%</tspan><tspan dx="8" font-size="17" fill="#c4c4cc">337 of 474</tspan></text><rect x="0" y="157" width="520" height="12" fill="#26262e"/><path d="M0 157H365.72A4 4 0 0 1 369.72 161V165A4 4 0 0 1 365.72 169H0Z" fill="#8fb8ff"/></g><g data-tool="qualweb" data-found="178" data-of="474" data-pct="37.6"><text x="0" y="211" font-size="19" fill="#f2f2f5">QualWeb</text><text x="520" y="211" text-anchor="end" fill="#f2f2f5"><tspan font-size="19" font-weight="700">37.6%</tspan><tspan dx="8" font-size="17" fill="#c4c4c