<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text and requests</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #111; background: #fff; }
  main { padding: 16px 24px; }
  .spacer { height: 1600px; }
  .box { padding: 12px 16px; background: linear-gradient(90deg, #112233, #223344); }
  .box p { margin: 0; color: #ffffff; }
  /* Stops on both sides of 3:1 (#f00 4.0:1, #ffcccc 1.3:1): the painted letters stay undecided (since batch 18, round 2, all-pass or all-fail stops are decided). */
  .clip { background: linear-gradient(90deg, #f00, #ffcccc); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 32px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1 id="t-painted" class="clip">Gradient heading text</h1>
  <div class="spacer"></div>
  <div class="box" id="lazy"><p id="t-lazy">This section posts to the server when it scrolls into view.</p></div>
</main>
<script>
  new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      fetch('/api/section-viewed', { method: 'POST', body: 'x' }).catch(() => {});
      // Third-party analytics: a beacon and a POST.
      navigator.sendBeacon('https://telemetry.example.invalid/beacon', 'viewed');
      fetch('https://telemetry.example.invalid/events/bulk', { method: 'POST', body: '[]', mode: 'no-cors' }).catch(() => {});
    }
  }).observe(document.getElementById('lazy'));
</script>
</body>
</html>
