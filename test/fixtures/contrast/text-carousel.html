<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text in a carousel</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #111; background: #fff; }
  main { padding: 16px 24px; }
  .track { width: 600px; overflow: hidden; }
  .slides { display: flex; width: 1800px; transition: transform 600ms ease-in-out; }
  .slide { width: 600px; height: 200px; flex: none; padding: 24px; box-sizing: border-box; animation: shimmer 900ms linear infinite alternate; }
  .slide p { margin: 0; color: #ffffff; font-size: 18px; }
  @keyframes shimmer { from { background-color: #d4d4d4; } to { background-color: #f2f2f2; } }
</style>
</head>
<body>
<main>
  <h1>News</h1>
  <div class="track"><div class="slides" id="slides">
    <div class="slide"><p id="t-slide-1">The first slide: white text on a pale background.</p></div>
    <div class="slide"><p id="t-slide-2">The second slide: white text on a pale background.</p></div>
    <div class="slide"><p id="t-slide-3">The third slide: white text on a pale background.</p></div>
  </div></div>
</main>
<script>
  let n = 0;
  setInterval(() => {
    n = (n + 1) % 3;
    document.getElementById('slides').style.transform = `translateX(${-600 * n}px)`;
  }, 1200);
</script>
</body>
</html>
