<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revealed text and a frame</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: #111; background: #fff; }
  main { padding: 16px 24px; }
  .spacer { height: 1600px; }
  .box { padding: 12px 16px; background: linear-gradient(90deg, #112233, #223344); }
  .box p { margin: 0; color: #ffffff; }
  #reveal { opacity: 0; }
  #reveal.in { opacity: 1; }
  iframe { width: 600px; height: 120px; border: 0; }
</style>
</head>
<body>
<main>
  <h1>Further down</h1>
  <iframe id="frame" title="Notice" src="frame-inner.html"></iframe>
  <div class="spacer"></div>
  <div class="box" id="reveal"><p id="t-reveal">This text fades in when it scrolls into view, in white on deep blue.</p></div>
</main>
<script>
  new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) e.target.classList.add('in');
  }).observe(document.getElementById('reveal'));
</script>
</body>
</html>
