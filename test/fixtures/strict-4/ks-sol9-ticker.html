<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>News</title><style>body{font:16px/1.5 Arial;color:#1b1b1b;margin:0 16px}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b00020;outline-offset:2px}</style></head><body><main><h1>News</h1><p><output id="ticker">0</output> <button type="button" onclick="clearInterval(timer)">Pause updates</button></p><p>The latest from the city: council agendas, park notices and street work this week.</p></main>
<script>document.addEventListener('keydown', function () {}); var timer; setTimeout(function () { var u = function () { document.getElementById('ticker').textContent = String(Date.now()); }; u(); timer = setInterval(u, 300); }, 60);</script></body></html>
