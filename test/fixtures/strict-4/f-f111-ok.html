<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact the city</title><style>body{font:16px/1.5 Arial;color:#1b1b1b;margin:0 16px}input,select,button{font:16px Arial}</style></head><body><main><h1>Contact the city</h1><form action="/contact" method="post">
<p><label for="n">Your name</label><br><input id="n" name="name" autocomplete="name"></p>
<p><span>E-mail address</span> <input name="email" type="email" autocomplete="email" aria-label="E-mail address"></p>
<p><label for="ph1">Phone number</label> (<input id="ph1" name="ph1" inputmode="numeric" size="3" aria-label="Area code">) <input name="ph2" inputmode="numeric" size="3" aria-label="Exchange"> - <input name="ph3" inputmode="numeric" size="4" aria-label="Line number"></p>
<p><button type="submit">Send</button></p></form></main></body></html>
