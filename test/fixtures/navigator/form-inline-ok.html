<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact form with error messages</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #fff; }
main { padding: 16px 24px; }
.field { margin-bottom: 12px; }
label { display: block; }
input, textarea { font: inherit; padding: 6px; border: 2px solid #767676; width: 280px; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
.bad { border-color: #c00; }
.error { color: #a00; margin: 4px 0 0; }
button { font: inherit; padding: 6px 14px; }
</style></head>
<body>
<main>
  <h1>Contact the office</h1>
  <div class="contact-form" id="contact">
    <div class="field"><label for="name">Your name (required)</label><input id="name" name="name" autocomplete="name" aria-describedby="name-err"><div class="error" id="name-err" aria-live="polite"></div></div>
    <div class="field"><label for="email">Email (required)</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-err"><div class="error" id="email-err" aria-live="polite"></div></div>
    <div class="field"><label for="msg">Message (required)</label><textarea id="msg" name="msg" rows="3" aria-describedby="msg-err"></textarea><div class="error" id="msg-err" aria-live="polite"></div></div>
    <button type="button" class="send">Send message</button>
  </div>
</main>
<script>
  // Client-side validation: each wrong field gets a message (written fresh on every send, in a live region
  // tied to the field), and focus moves to the first wrong field.
  var words = { name: 'Enter your name', email: 'Enter your email address, like name@example.com', msg: 'Enter your message' };
  document.querySelector('.send').addEventListener('click', function () {
    var first = null;
    ['name', 'email', 'msg'].forEach(function (id) {
      var f = document.getElementById(id);
      var bad = !f.value.trim() || (id === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.value.trim()));
      var box = document.getElementById(id + '-err');
      box.replaceChildren();
      f.classList.toggle('bad', bad);
      f.setAttribute('aria-invalid', String(bad));
      if (bad) {
        var p = document.createElement('p');
        p.textContent = words[id];
        box.appendChild(p);
        if (!first) first = f;
      }
    });
    if (first) first.focus();
    else fetch('/contact', { method: 'POST', body: JSON.stringify({}) });
  });
</script>
</body></html>
