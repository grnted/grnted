<!-- 2.1.2 failure: every 80 ms an interval puts focus back in the field; the page has no focus, blur or key listener. -->
<p><label for="trap">Your code</label> <input id="trap" type="text" autocomplete="off"></p>
<p><a href="/next.html">Next step</a> <a href="/other.html">Other</a></p></main>
<script>var trap = document.getElementById('trap'); var armed = false; setInterval(function () { if (armed && document.activeElement !== trap) trap.focus(); if (document.activeElement === trap) armed = true; }, 80);</script>
