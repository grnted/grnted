<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Keyboard fixture: a submit button in a form that takes focus back</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; }</style></head>
<body>
<main>
<h1>Search the catalog</h1>
<p><a href="/help.html">Help</a></p>
<!-- A button with no type attribute inside a form submits it: pressing it is a way out this test does
     not take (it would send the form), so the result is not testable, never a failure. -->
<form action="/search" method="get"><label for="q">Title</label> <input id="q" name="q" type="search"> <button id="trap">Search</button></form>
<p><a href="/next.html">Next</a></p>
</main>
<script>
document.getElementById('trap').addEventListener('blur', function (e) { var t = e.target; setTimeout(function () { t.focus(); }, 20); });
</script>
</body>
</html>
