<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard fixture: dialog whose close button does not work</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; } #dialog { position: fixed; top: 24px; right: 24px; width: 360px; background: #fff; padding: 16px; border: 2px solid #333; }</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <p><a href="/one.html">First link</a></p>
  <p><a href="/two.html">Second link</a></p>
</main>
<!-- Planted failure (2.1.2): focus is held in the dialog, Esc does nothing and its Close button is broken. -->
<div id="dialog" role="dialog" aria-modal="true" aria-label="Survey">
  <p><label for="c">Comments</label> <textarea id="c"></textarea></p>
  <button type="button" id="close">Close</button>
</div>
<script>
  // Focus stays in the dialog while it is open, wherever focus was.
  var d = document.getElementById('dialog');
  var ping = function (x) { new Image().src = '/pressed?' + x; };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || !d.isConnected) return;
    e.preventDefault();
    var f = Array.prototype.slice.call(d.querySelectorAll('a[href], area[href], button, input, textarea'));
    var i = f.indexOf(document.activeElement);
    f[i < 0 ? 0 : (i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  });
</script>
</body>
</html>
