<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard fixture: single-key shortcut that can be moved to a modifier key</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; } .note { border: 1px solid #333; padding: 4px; margin: 4px 0; }</style>
</head>
<body>
<main>
  <h1>Notes</h1>
  <p>Press J to add a note.</p>
  <!-- Clean control (2.1.4, remap option): a setting moves the shortcut onto the Alt key. -->
  <p><label><input type="checkbox" id="alt"> Add notes only with the Alt key held down with "J"</label></p>
  <div id="notes"></div>
</main>
<script>
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.key.toLowerCase() !== 'j') return;
    if (document.getElementById('alt').checked !== e.altKey) return;
    var n = document.createElement('p');
    n.className = 'note';
    n.textContent = 'New note';
    document.getElementById('notes').appendChild(n);
  });
</script>
</body>
</html>
