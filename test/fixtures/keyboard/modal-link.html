<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard fixture: dialog left only through a link or a submit button</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; } #dialog { position: fixed; top: 24px; right: 24px; width: 360px; background: #fff; padding: 16px; border: 2px solid #333; }</style>
</head>
<body>
<main><h1>Welcome</h1><p><a href="/one.html">First link</a></p></main>
<!-- Not testable (2.1.2): the only ways out follow a link or submit a form, which the test never activates. -->
<div id="dialog" role="dialog" aria-modal="true" aria-label="Age check">
  <form action="/age" method="post"><label for="y">Year of birth</label> <input id="y" name="y">
  <button type="submit">Confirm</button></form>
  <p><a href="/leave.html">Leave this site</a></p>
</div>
<script>
  // Focus stays in the dialog while it is open, wherever focus was.
  var d = document.getElementById('dialog');
  var ping = function (x) { new Image().src = '/pressed?' + x; };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || !d.isConnected) return;
    e.preventDefault();
    var f = Array.prototype.slice.call(d.querySelectorAll('a[href], area[href], button, input, textarea'));
    var i = f.indexOf(document.activeElement);
    f[i < 0 ? 0 : (i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  });
</script>
</body>
</html>
