<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard fixture: dialog that closes only after the server answers</title>
<style>
  body { font: 16px/1.5 sans-serif; margin: 24px; }
  #dialog { position: fixed; top: 24px; right: 24px; width: 320px; background: #fff; padding: 16px; border: 2px solid #333; }
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <p><a href="/one.html">First link</a></p>
</main>
<!-- Not testable (2.1.2): the Close button posts to the server and closes on its answer; the guard stops the post. -->
<div id="dialog" role="dialog" aria-modal="true" aria-label="Notice">
  <p>Our hours changed.</p>
  <button type="button" id="more">More</button>
  <button type="button" id="close">Close</button>
</div>
<script>
  var d = document.getElementById('dialog');
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || !d.isConnected || !d.contains(document.activeElement)) return;
    e.preventDefault();
    var f = Array.prototype.slice.call(d.querySelectorAll('button'));
    var i = f.indexOf(document.activeElement);
    f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  });
  document.getElementById('close').addEventListener('click', function () {
    fetch('/notice/seen', { method: 'POST' }).then(function () { d.remove(); }, function () {});
  });
</script>
</body>
</html>
