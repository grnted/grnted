<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus fixture: rings drawn inside the box</title>
<style>
  body { font: 16px/1.5 Arial, sans-serif; margin: 24px; color: #222; background: #fff; }
  button { font: inherit; background: #fff; color: #1a1a1a; border: 2px solid #595959; padding: 10px 16px; margin: 8px; }
  button:focus { outline: none; }
  #pale:focus { box-shadow: inset 0 0 0 4px #dddddd; }
  #strong:focus { box-shadow: inset 0 0 0 4px #1d3557; }
</style>
</head>
<body>
<main>
  <h1>Library card</h1>
  <p><button id="pale" type="button">Renew a card</button></p>
  <p><button id="strong" type="button">Report a lost card</button></p>
</main>
</body>
</html>
