<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard fixture: focus rings drawn away from the element</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; }
  .card { position: relative; margin: 32px 0; }
  a { color: #0645ad; }
  /* Clean control (2.4.7): a ring drawn by ::after, 16 px outside the link. */
  .pseudo { position: relative; outline: none; }
  .pseudo:focus::after { content: ''; position: absolute; inset: -16px; border: 3px solid #005fcc; }
  /* Clean control (2.4.7): a tall card shows the ring (:focus-within) for the link inside it. */
  .tall { height: 600px; padding: 12px; }
  .tall a { outline: none; }
  .tall:focus-within { outline: 3px solid #005fcc; }</style>
</head>
<body>
<main>
  <h1>Rings</h1>
  <p class="card"><a class="pseudo" href="/pseudo.html">Ring drawn by a pseudo-element</a></p>
  <div class="tall"><p><a href="/card.html">Link in a tall card</a></p></div>
</main>
</body>
</html>
