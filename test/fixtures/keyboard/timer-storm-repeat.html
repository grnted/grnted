<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard fixture: navigation from a timer every millisecond</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; }</style>
</head>
<body>
<main>
  <h1>Redirects</h1>
  <!-- Clean control (3.2.1): a timer started by the third key press loads another page while focus
       moves (once here; every 10 ms in timer-repeat.html); focusing the link again does nothing new,
       so the focus did not cause it. -->
  <p><a href="/1.html">One</a> <a href="/2.html">Two</a> <a href="/3.html">Three</a> <a href="/4.html">Four</a></p>
  <p><a href="/5.html">Five</a> <a href="/6.html">Six</a> <a href="/7.html">Seven</a> <a href="/8.html">Eight</a></p>
</main>
<script>
  var presses = 0;
  document.addEventListener('keydown', function () {
    if (++presses !== 3) return;
    var repeat = location.pathname.indexOf('repeat') >= 0;
    (repeat ? setInterval : setTimeout)(function () { location.href = '/elsewhere.html'; }, repeat ? 1 : 0);
  });
</script>
</body>
</html>
