<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Keyboard fixture: a field that takes focus back 60 ms after Tab</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; }</style></head>
<body>
<main>
<h1>Enter your code</h1>
<p><a href="/help.html">Help</a></p>
<!-- Planted failure (2.1.2): leaving the field by Tab, Shift+Tab or Escape, a timer puts focus back in it. -->
<p><label for="trap">Your code</label> <input id="trap" type="text" autocomplete="off"></p>
<p><a href="/next.html">Next step</a> <a href="/other.html">Other</a></p>
</main>
<script>
document.getElementById('trap').addEventListener('blur', function (e) { var t = e.target; setTimeout(function () { t.focus(); }, 60); });
</script>
</body>
</html>
