<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>City news (a canvas wave that ends during the control check, and a Pause button that does nothing)</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; } #box { width: 600px; max-width: 100%; height: 120px; background: #eef3f8; }</style></head>
<body><main>
<h1>City news</h1>
<div id="box"><canvas id="wave" width="600" height="120" role="img" aria-label="A moving wave"></canvas></div>
<button type="button" id="pause" onclick="void 0">Pause</button>
<p>The council meets on Tuesday.</p>
</main>
<script>
// The wave is drawn every frame. Its own end comes a quarter second after the pointer reaches the Pause button (a
// stand-in for a finite animation whose end lands in the test's control check, as an 8 s run does by its own clock);
// the button itself does nothing.
(function () {
  var c = document.getElementById('wave'), g = c.getContext('2d'), t0 = performance.now(), endAt = Infinity;
  document.getElementById('pause').addEventListener('mouseover', function () { if (endAt === Infinity) endAt = performance.now() + 250; });
  function step(t) { if (t > endAt) return; var e = t - t0; g.fillStyle = '#eef3f8'; g.fillRect(0, 0, 600, 120); g.fillStyle = '#00376d'; g.fillRect((e / 8) % 520, 30, 80, 60); requestAnimationFrame(step); }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
