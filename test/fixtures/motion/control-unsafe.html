<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Carousel whose pause controls could act on the site</title><style>
  .carousel { position: relative; width: 600px; height: 240px; overflow: hidden; border: 1px solid #333; }
  .slide { position: absolute; inset: 0; padding: 2rem; font: 24px sans-serif; opacity: 0; transition: opacity .4s; background: #eef; }
  .slide.active { opacity: 1; }
</style></head>
<body><main>
<h1>News</h1>
<div class="carousel" id="hero">
  <div class="slide active">Enrolment opens on Monday for all grades.</div>
  <div class="slide">The library has new opening hours this term.</div>
</div>
<form action="/preferences" method="get"><button>Pause slideshow</button></form>
<p><a href="javascript:void(window.pauseIt())">Pause the slides</a></p>
<svg width="160" height="40" role="img" aria-label="Player"><a href="/player/pause" aria-label="Pause"><rect width="160" height="40" fill="#036"/></a></svg>
</main>
<script>
  var slides = document.querySelectorAll("#hero .slide"), i = 0, paused = false;
  function next() { if (paused) return; slides[i].classList.remove("active"); i = (i + 1) % slides.length; slides[i].classList.add("active"); }
  setInterval(next, 3000);
  window.pauseIt = function () { paused = true; };
  document.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); paused = true; });
</script>
</body>
</html>
