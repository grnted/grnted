<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Flashing further down, shown late</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  h1, p { margin: 1rem; }
  .flash { width: 100%; height: 400px; background: #000; animation: flash 0.125s steps(1, end) infinite; }
  @keyframes flash { 0% { background: #000; } 50% { background: #fff; } }
</style></head>
<body><main>
<h1>Flashing further down, shown late</h1>
<div id="app" aria-busy="true"><p>Loading…</p></div>
<template id="late"><p>Synthetic test pattern, put in the page 1.5 s after it loaded (as a script-built page does).</p><div style="height: 2400px"></div><div class="flash" id="flasher" role="img" aria-label="Test pattern"></div><div style="height: 1200px"></div></template>
</main>
<script>
setTimeout(function () {
  var app = document.getElementById('app');
  app.innerHTML = document.getElementById('late').innerHTML;
  app.removeAttribute('aria-busy');
}, 1500);
</script>
</body>
</html>
