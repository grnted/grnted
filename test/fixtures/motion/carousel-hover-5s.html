<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider that advances every 5 s and pauses only on hover</title>
<style>
  .carousel { position: relative; width: 600px; height: 240px; overflow: hidden; border: 1px solid #333; }
  .slide { position: absolute; inset: 0; padding: 2rem; font: 24px sans-serif; opacity: 0; transition: opacity .4s; background: #eef; }
  .slide.active { opacity: 1; }
</style></head>
<body><main>
<h1>News</h1>
<div class="carousel" id="hero">
  <div class="slide active">Enrolment opens on Monday for all grades.</div>
  <div class="slide">The library has new opening hours this term.</div>
</div>
</main>
<script>
  (function () {
    var slides = document.querySelectorAll('#hero .slide'), i = 0, hover = false, hero = document.getElementById('hero');
    hero.addEventListener('mouseenter', function () { hover = true; });
    hero.addEventListener('mouseleave', function () { hover = false; });
    setInterval(function () { if (hover) return; slides[i].classList.remove('active'); i = (i + 1) % slides.length; slides[i].classList.add('active'); }, 5000);
  })();
</script>
</body>
</html>
