<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A notice that fades out over 6 seconds</title>
<style>
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }
#banner { width: 300px; height: 60px; background: #0b4fb3; color: #fff; padding: 8px; animation: fade 6s linear 1 forwards; }
</style></head>
<body><main><h1>News</h1><p id="banner">Spring show on May 9.</p><p>No controls on this page. The notice fades out over 6 s and stays at opacity 0.</p></main></body>
</html>
