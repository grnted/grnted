<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Notes</title></head>
<body><main>
<h1>Notes</h1>
<section aria-label="Note" id="box">
  <p id="note" style="font: 20px sans-serif; padding: 1rem; border: 1px solid #333; width: 500px">Meeting moved to Thursday at 6 pm.</p>
  <p><button type="button" id="undo">Undo</button></p>
  <p><input type="checkbox" id="tips"> <label for="tips">Show shake tips</label></p>
  <p><input type="checkbox" id="on" checked> <label for="on">Shake to undo</label></p>
</section>
</main>
<script>
  // Grok review round 1: a 3 s shake cooldown, and a tips box (listed first) that does not gate the listener.
  var on = document.getElementById('on'), tips = document.getElementById('tips');
  var undo = function () { document.getElementById('note').textContent = 'Meeting on Wednesday at 6 pm.'; };
  var last = 0;
  addEventListener('devicemotion', function (e) {
    var a = e.accelerationIncludingGravity || e.acceleration || {};
    if (Math.abs(a.x || 0) + Math.abs(a.y || 0) < 15) return;
    if (!on.checked || Date.now() - last < 3000) return;
    last = Date.now();
    undo();
  });
  document.getElementById('undo').addEventListener('click', undo);
  // Each change of the tips box is reported, so the test can see the box was put back.
  tips.addEventListener('change', function () { new Image().src = '/static.html?tips=' + tips.checked; });
</script>
</body>
</html>
