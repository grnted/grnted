<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Session timer that stops the page's media</title><style>
  .carousel { position: relative; width: 600px; height: 240px; overflow: hidden; border: 1px solid #333; }
  .slide { position: absolute; inset: 0; padding: 2rem; font: 24px sans-serif; opacity: 0; transition: opacity .4s; background: #eef; }
  .slide.active { opacity: 1; }
</style></head>
<body><main>
<h1>Account overview</h1>
<div class="carousel" id="hero">
  <div class="slide active">Enrolment opens on Monday for all grades.</div>
  <div class="slide">The library has new opening hours this term.</div>
</div>
<audio id="music" src="tone.wav" autoplay loop></audio>
<div id="warn" hidden style="position: fixed; inset: 20% 25%; background: #fff; border: 2px solid #333; padding: 2rem">Your session has expired.</div>
</main>
<script>
  var slides = document.querySelectorAll('#hero .slide'), i = 0;
  var rotate = setInterval(function () { slides[i].classList.remove('active'); i = (i + 1) % slides.length; slides[i].classList.add('active'); }, 3000);
  // After 15 minutes the session ends: media stops, the carousel stops, a warning shows.
  setTimeout(function () { document.getElementById('music').pause(); clearInterval(rotate); document.getElementById('warn').hidden = false; }, 15 * 60 * 1000);
</script>
</body>
</html>
