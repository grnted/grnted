<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Moving alert bar with a Dismiss icon button</title>
<style>
  .bar { width: 700px; overflow: hidden; border: 1px solid #333; background: #fff4d6; display: flex; align-items: center; gap: 8px; }
  .bar .track { flex: 1; overflow: hidden; }
  .bar p { margin: 0; padding: .75rem; white-space: nowrap; font: 18px sans-serif; animation: scroll 8s linear infinite; }
  .bar.paused p { animation-play-state: paused; }
  @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .pulse { width: 320px; height: 120px; background: #dde; font: 18px sans-serif; padding: 1rem; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
</style></head>
<body><main>
<h1>City news</h1>
<div class="bar" id="bar"><div class="track"><p>Water main repair on Oak Street: expect low pressure until 6 pm.</p></div><button type="button" id="c" aria-label="Dismiss alert">×</button></div>
<p>Other content next to it.</p>
</main>
<script>
document.getElementById('c').addEventListener('click', function () { document.getElementById('bar').remove(); });
</script>
</body>
</html>
