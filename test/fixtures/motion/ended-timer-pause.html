<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>City news (rotating headlines whose Pause button clears the rotation)</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; } #box { width: 600px; max-width: 100%; min-height: 100px; background: #eef3f8; padding: 16px; } #box p { margin: 0; font-size: 20px; }</style></head>
<body><main>
<h1>City news</h1>
<div id="box"><p id="headline">Story 1: The library opens a new reading room.</p></div>
<button type="button" id="pause">Pause</button>
<p>The council meets on Tuesday.</p>
</main>
<script>
// Headlines rotate every 1.2 s until the Pause button clears the rotation's timer.
(function () {
  var stories = ['Story 1: The library opens a new reading room.', 'Story 2: Road work on Main Street ends Friday.', 'Story 3: The pool reopens on Monday.'], i = 0;
  var t = setInterval(function () { i = (i + 1) % stories.length; document.getElementById('headline').textContent = stories[i]; }, 1200);
  document.getElementById('pause').addEventListener('click', function () { clearInterval(t); });
})();
</script>
</body>
</html>
