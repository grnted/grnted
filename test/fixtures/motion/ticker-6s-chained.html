<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A ticker that updates every 2 seconds for 6 seconds with chained timeouts</title>
<style>.ticker { width: 600px; min-height: 80px; padding: 24px 16px; font: 20px sans-serif; background: #eef3f8; }</style></head>
<body><main>
<h1>City news</h1>
<!-- Each update sets the next one (a chain of 2 s timeouts), for 6 s from the first. -->
<p class="ticker" id="ticker">Update 0: the pool opens on Monday.</p>
<p>Other content next to the ticker.</p>
</main>
<script>
  (function () {
    var el = document.getElementById('ticker'), t0 = Date.now(), n = 0;
    function tick() {
      n++;
      el.textContent = 'Update ' + n + ': ' + ['the pool opens on Monday.', 'the library has new hours.', 'the bridge closes for repairs.'][n % 3];
      if (Date.now() - t0 < 5900) setTimeout(tick, 2000); else window.__simDone = true;
    }
    setTimeout(tick, 2000);
  })();
</script>
</body>
</html>
