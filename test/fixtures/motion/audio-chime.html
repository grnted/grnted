<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synth</title></head>
<body><main>
<h1>Synth</h1>
<p>A short chime made with Web Audio when the page opens.</p>
</main>
<script>
  var ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
  gain.gain.value = 0.2; osc.connect(gain); gain.connect(ctx.destination);
  ctx.resume().then(function () { osc.start(); osc.stop(ctx.currentTime + 0.5); });
</script>
</body>
</html>
