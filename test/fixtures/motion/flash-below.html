<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Flashing further down</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  h1, p { margin: 1rem; }
  .flash { position: absolute; left: 100px; top: 2000px; width: 500px; height: 500px; background: #000; animation: flash 0.2s steps(1, end) infinite; }
  @keyframes flash { 0% { background: #000; } 50% { background: #fff; } }
</style></head>
<body><main>
<h1>Flashing further down</h1>
<p>Synthetic test pattern.</p><div style="height: 2600px"></div>
<div class="flash" role="img" aria-label="Test pattern"></div>
</main></body>
</html>
