<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Carousel whose slides are hidden between steps</title>
<style>
  .stories { width: 600px; min-height: 120px; background: #eef3f8; }
  .stories p { display: none; margin: 0; padding: 40px 16px; font: 20px sans-serif; }
  .stories p.on { display: block; }
</style></head>
<body><main>
<h1>City news</h1>
<!-- Only the current story is displayed: the story a timer run changed is hidden again at the next step. -->
<div class="stories" id="stories">
  <p class="on">Story 1: the pool opens on Monday.</p>
  <p>Story 2: the library has new hours.</p>
  <p>Story 3: the bridge closes for repairs.</p>
</div>
<p>Other content next to the stories.</p>
</main>
<script>
  (function () {
    var s = document.querySelectorAll('#stories p'), i = 0;
    setInterval(function () { s[i].classList.remove('on'); i = (i + 1) % s.length; s[i].classList.add('on'); }, 1500);
  })();
</script>
</body>
</html>
