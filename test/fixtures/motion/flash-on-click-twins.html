<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lighthouse open day</title>
<style>body { font: 18px sans-serif; margin: 0; padding: 16px; } .lamp { width: 720px; height: 240px; background: #fff; border: 1px solid #333; margin: 16px 0; } @keyframes blink { 0% { background: #000; } 50% { background: #fff; } 100% { background: #fff; } } .note { display: none; } .note.open { display: block; } .lamp.open { animation: blink .25s steps(1, end) 8 both; }</style></head>
<body><main>
<h1>Lighthouse open day</h1>
<p>The lighthouse on the point is open to visitors on the first Sunday of each month.</p>
<!-- Planted failure (2.3.1): two buttons that look and read the same; the first shows a still note, the second starts the lamp blinking four times a second. -->
<div class="card"><h2>Keeper’s talk</h2><button type="button" class="preview" data-for="n0">Play preview</button><p class="note" id="n0">The talk starts at eleven in the lamp room.</p></div>
<div class="card"><h2>Lamp at night</h2><button type="button" class="preview" data-for="n1">Play preview</button><div id="n1" class="lamp note"></div></div>
<p>The climb is 112 steps. The keeper shows the lamp room at eleven and at two.</p>
</main>
<script>document.querySelectorAll('button[data-for]').forEach(function (b) { b.addEventListener('click', function () { document.getElementById(b.getAttribute('data-for')).classList.add('open'); }); });</script>
</body>
</html>
