<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synth</title></head>
<body><main>
<h1>Synth</h1>
<p>A tone made with Web Audio plays by itself.</p>
<button type="button" id="mute">Mute sound</button>
</main>
<script>
var ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain(); gain.gain.value = 0.2; osc.connect(gain); gain.connect(ctx.destination); osc.start(); document.getElementById('mute').addEventListener('click', function () { ctx.suspend(); });
</script>
</body>
</html>
