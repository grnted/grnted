<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A busy main region around a ticker</title>
<style>
  .ticker { width: 700px; overflow: hidden; border: 1px solid #333; }
  .ticker p { margin: 0; padding: 1rem; white-space: nowrap; font: 20px sans-serif; animation: scroll 8s linear infinite; }
  @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
</style></head>
<body><main aria-busy="true">
<h1>Announcements</h1>
<div class="ticker"><p>School closes early on Wednesday for staff training. Buses leave at 1 pm.</p></div>
</main></body>
</html>
