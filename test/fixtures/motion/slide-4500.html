<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A banner that slides for 4.5 seconds</title>
<style>
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(440px); } }
#banner { width: 120px; height: 60px; background: #0b4fb3; color: #fff; padding: 8px; animation: slide 4.5s linear 1 both; }
</style></head>
<body><main><h1>News</h1><p id="banner">Spring show</p><p>No controls on this page: the banner moves for 4.5 s, then stops.</p></main></body>
</html>
