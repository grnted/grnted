<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Notes</title></head>
<body><main>
<h1>Notes</h1>
<section aria-label="Note" id="box">
  <p id="note" style="font: 20px sans-serif; padding: 1rem; border: 1px solid #333; width: 500px">Meeting moved to Thursday at 6 pm.</p>
  <p><button type="button" id="undo">Undo</button></p>
  <p><span id="lbl">Shake hints</span> <span role="switch" id="sw" tabindex="0" aria-checked="false" aria-labelledby="lbl" style="display: inline-block; width: 40px; height: 24px; border: 1px solid #333"></span></p>
  <p><input type="checkbox" id="on" checked> <label for="on">Shake to undo</label></p>
</section>
</main>
<script>
  var undo = function () { document.getElementById('note').textContent = 'Meeting on Wednesday at 6 pm.'; };
  document.getElementById('undo').addEventListener('click', undo);
  // A real "Shake to undo" box after it keeps the test on the page. A switch that does not gate the motion and updates its state 600 ms after a click; each update is reported.
  var sw = document.getElementById('sw');
  sw.addEventListener('click', function () {
    var next = String(sw.getAttribute('aria-checked') !== 'true');
    setTimeout(function () { sw.setAttribute('aria-checked', next); new Image().src = '/static.html?hints=' + next; }, 600);
  });
  var last = 0;
  addEventListener('devicemotion', function (e) {
    var a = e.accelerationIncludingGravity || e.acceleration || {};
    if (!document.getElementById('on').checked) return;
    if (Math.abs(a.x || 0) + Math.abs(a.y || 0) > 15 && Date.now() - last > 300) { last = Date.now(); undo(); }
  });
</script>
</body>
</html>
