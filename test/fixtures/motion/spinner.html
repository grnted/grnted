<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Loading indicators</title>
<style>
  .spinner { width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: #036; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { width: 400px; height: 24px; background: #eee; overflow: hidden; }
  .bar span { display: block; width: 120px; height: 24px; background: #036; animation: slide 1.5s linear infinite; }
  @keyframes slide { from { transform: translateX(-120px); } to { transform: translateX(400px); } }
  .pulse { width: 300px; height: 60px; background: #ddd; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
</style></head>
<body><main>
<h1>Results</h1>
<div class="spinner" aria-label="Loading"></div>
<div class="bar" role="progressbar" aria-label="Upload progress"><span></span></div>
<div class="pulse" aria-busy="true" aria-label="Results are loading"></div>
<p>Other content.</p>
</main></body>
</html>
