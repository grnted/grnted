<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Welcome</title></head>
<body><main>
<h1>Welcome</h1>
<audio id="music" src="tone.wav" autoplay loop></audio>

<button type="button" id="snd">♫ Music: on</button>

</script>
</body>
