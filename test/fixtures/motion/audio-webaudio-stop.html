<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synth</title></head>
<body><main>
<h1>Synth</h1>
<p>A tone made with Web Audio, with a stop button.</p>
<button type="button" id="stop">Stop sound</button>
</main>
<script>
  var ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
  gain.gain.value = 0.2; osc.connect(gain); gain.connect(ctx.destination); osc.start();
  document.getElementById('stop').addEventListener('click', function () { ctx.suspend(); });
</script>
</body>
</html>
