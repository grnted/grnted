<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Canvas animation</title></head>
<body><main>
<h1>Particles</h1>
<canvas id="c" width="500" height="200" aria-label="Decorative particles"></canvas>
<p>Other content next to the animation.</p>
</main>
<script>
  var c = document.getElementById('c'), g = c.getContext('2d'), x = 0;
  (function frame() {
    x = (x + 4) % 500;
    g.fillStyle = '#fff'; g.fillRect(0, 0, 500, 200);
    g.fillStyle = '#036'; g.fillRect(x, 50, 80, 80);
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
