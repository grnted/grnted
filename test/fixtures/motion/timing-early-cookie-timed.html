<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account</title></head>
<body><main id="main">
<h1>Account</h1>
<p>Your account summary.</p>
</main>
<script>
  // A 15 s time limit (round 2, Sol 4): a session-cookie warning that gives a time.
  setTimeout(function () {
    var p = document.createElement('p');
    p.setAttribute('role', 'alert');
    p.textContent = 'Your session cookie expires in two minutes. Save your work.';
    document.getElementById('main').appendChild(p);
  }, 15000);
</script>
</body>
</html>
