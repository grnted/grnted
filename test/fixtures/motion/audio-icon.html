<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Welcome</title></head>
<body><main>
<h1>Welcome</h1>
<div class="player"><audio id="music" src="tone.wav" autoplay loop></audio>
<button type="button" class="snd-toggle" id="snd"><svg width="24" height="24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg></button></div>
</main>
<script>
document.getElementById('snd').addEventListener('click', function () { var a = document.getElementById('music'); a.paused ? a.play() : a.pause(); });
</script>
</body>
</html>
