<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Spinners further down, and a flasher shown late below them</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  h1, p { margin: 1rem; }
  .spin { width: 40px; height: 40px; margin: 1rem; border: 4px solid #1a4fa0; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flash { width: 100%; height: 400px; background: #000; animation: flash 0.125s steps(1, end) infinite; }
  @keyframes flash { 0% { background: #000; } 50% { background: #fff; } }
</style></head>
<body><main>
<h1>Spinners further down, and a flasher shown late below them</h1>
<p>Synthetic test pattern: two loading spinners below the first screen; a flasher further down is put in 1.5 s after the page loaded.</p>
<div style="height: 1200px"></div>
<div class="spin" aria-hidden="true"></div>
<div style="height: 1400px"></div>
<div class="spin" aria-hidden="true"></div>
<div style="height: 1400px"></div>
<div id="late"></div>
<div style="height: 1000px"></div>
</main>
<script>
setTimeout(function () { document.getElementById('late').innerHTML = '<div class="flash" id="flasher" role="img" aria-label="Test pattern"></div>'; }, 1500);
</script>
</body>
</html>
