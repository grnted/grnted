<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Notes</title></head>
<body><main>
<h1>Notes</h1>
<section aria-label="Note" id="box">
  <p id="note" style="font: 20px sans-serif; padding: 1rem; border: 1px solid #333; width: 500px">Meeting moved to Thursday at 6 pm.</p>
  <p><button type="button" id="undo">Undo</button></p>
  <shake-setting></shake-setting>
</section>
</main>
<script>
  var undo = function () { document.getElementById('note').textContent = 'Meeting on Wednesday at 6 pm.'; };
  document.getElementById('undo').addEventListener('click', undo);
  // The off switch lives in an open shadow root.
  customElements.define('shake-setting', class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<p><input type="checkbox" id="on" checked> <label for="on">Shake to undo</label></p>'; }
  });
  var last = 0;
  addEventListener('devicemotion', function (e) {
    var on = document.querySelector('shake-setting').shadowRoot.getElementById('on');
    if (!on.checked) return;
    var a = e.accelerationIncludingGravity || e.acceleration || {};
    if (Math.abs(a.x || 0) + Math.abs(a.y || 0) > 15 && Date.now() - last > 300) { last = Date.now(); undo(); }
  });
</script>
</body>
</html>
