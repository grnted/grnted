<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synth</title></head>
<body><main>
<h1>Synth</h1>
<p>A Web Audio tone of 3.5 s; when it ends the page suspends its context. The Pause button does nothing.</p>
<p><button type="button" id="pause">Pause</button></p>
</main>
<script>
  var ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
  gain.gain.value = 0.2; osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 3.5);
  osc.onended = function () { ctx.suspend(); };
  document.getElementById('pause').addEventListener('click', function () { void 0; });

</script>
</body>
</html>
