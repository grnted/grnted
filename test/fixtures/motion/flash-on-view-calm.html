<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Night market</title>
<style>body { font: 18px sans-serif; margin: 0; padding: 16px; } #sign { width: 720px; height: 200px; background: #fff; border: 1px solid #333; margin: 16px 0; } #sign { opacity: .2; transition: opacity .7s; background: #123; } #sign.in { opacity: 1; } .gap { height: 2600px; }</style></head>
<body><main>
<h1>Night market</h1>
<p>The night market opens on the square at six.</p>
<!-- Passes (2.3.1): far down the page, the sign fades in once when it comes into view. -->
<p>Stalls sell hot food, lanterns and winter clothes. Bring cash for the smaller stalls.</p><div class="gap"></div><div id="sign"></div><p>Stalls sell hot food, lanterns and winter clothes. Bring cash for the smaller stalls.</p>
</main>
<script>new IntersectionObserver(function (entries, io) { if (entries.some(function (e) { return e.isIntersecting; })) { document.getElementById('sign').classList.add('in'); io.disconnect(); } }, { threshold: 0.5 }).observe(document.getElementById('sign'));</script>
</body>
</html>
