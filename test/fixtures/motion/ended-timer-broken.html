<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>City news (headlines that rotate until their own end during the control check, and a Pause button that does nothing)</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; } #box { width: 600px; max-width: 100%; min-height: 100px; background: #eef3f8; padding: 16px; } #box p { margin: 0; font-size: 20px; }</style></head>
<body><main>
<h1>City news</h1>
<div id="box"><p id="headline">Story 1: The library opens a new reading room.</p></div>
<button type="button" id="pause" onclick="void 0">Pause</button>
<p>The council meets on Tuesday.</p>
</main>
<script>
// Headlines rotate every 1.2 s. The rotation clears its own timer at its first run once its end has come, a quarter
// second after the pointer reaches the Pause button (a stand-in for a rotation that stops by its own clock during the
// test's control check); the button itself does nothing.
(function () {
  var stories = ['Story 1: The library opens a new reading room.', 'Story 2: Road work on Main Street ends Friday.', 'Story 3: The pool reopens on Monday.'], i = 0, endAt = Infinity;
  document.getElementById('pause').addEventListener('mouseover', function () { if (endAt === Infinity) endAt = performance.now() + 250; });
  var t = setInterval(function () { if (performance.now() > endAt) { clearInterval(t); return; } i = (i + 1) % stories.length; document.getElementById('headline').textContent = stories[i]; }, 1200);
})();
</script>
</body>
</html>
