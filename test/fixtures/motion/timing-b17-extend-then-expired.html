<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account overview</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 44rem; } [hidden] { display: none; } .dlg { position: fixed; inset: 20% 20%; background: #fff; border: 2px solid #333; padding: 1.5rem; } </style></head>
<body><main>
<h1>Account overview</h1>
<p>Your recent activity.</p>
<div id="warn" class="dlg" role="alertdialog" aria-labelledby="wt" hidden><p id="wt">Your session will expire in 2 minutes because you have been inactive.</p><p id="wb"><button type="button" id="stay">Stay signed in</button></p></div>
</main>
<script>
  var warn, end;
  function schedule() {
    warn = setTimeout(function () { document.getElementById('warn').hidden = false; }, 13 * 60 * 1000);
    // Two minutes later the same box says the session is over (no navigation: the page shows it in place).
    end = setTimeout(function () { document.getElementById('wt').textContent = 'Your session has expired.'; document.getElementById('wb').innerHTML = '<a href="static.html">Sign in again</a>'; }, 15 * 60 * 1000);
  }
  schedule();
  document.getElementById('stay').addEventListener('click', function () { clearTimeout(warn); clearTimeout(end); document.getElementById('warn').hidden = true; schedule(); });
</script>
</body>
</html>
