<!doctype html><html lang="en">
<meta charset="utf-8"><title>Tab checkmark</title>
<style>
body{background:white;color:#111}
button{font:16px Arial;background:white;color:#111;border:0;padding:12px}
[aria-selected=true]{border-bottom:3px solid #ddd}
</style>
<div role="tablist" aria-label="Period">
  <button role="tab" aria-selected="false">Today</button>
  <button role="tab" aria-selected="true">Week <span aria-hidden="true">✓</span></button>
</div></html>
