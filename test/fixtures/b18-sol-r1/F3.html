<!doctype html><html lang="en">
<meta charset="utf-8"><title>Reusable chart series</title>
<style>body{background:white;color:#111}</style>
<svg width="500" height="220" viewBox="0 0 500 220" role="img"
     aria-label="Monthly bicycle hires">
  <defs><polyline id="series" fill="none"
    points="40,160 150,70 260,120 450,50"/></defs>
  <use href="#series" stroke="#ddd" stroke-width="3"/>
  <g fill="#111"><text x="40" y="210">Jan</text>
    <text x="240" y="210">Feb</text><text x="440" y="210">Mar</text></g>
</svg></html>
