<!doctype html><html lang="en">
<meta charset="utf-8"><title>Responsive scrolling notice</title>
<style>
body{font:16px/20px Arial;background:white;color:#111}
.box{height:120px;width:600px;max-width:100%;overflow:hidden}
@media(max-width:1100px){.box{height:62px;width:300px;overflow:auto}}
</style>
<div class="box" tabindex="0" aria-label="Opening times">
  Morning session: nine.<br>
  Afternoon session: two.<br>
  Evening session: six.
</div></html>
