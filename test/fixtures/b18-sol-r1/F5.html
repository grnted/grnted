<!doctype html><html lang="en">
<meta charset="utf-8"><title>Chart with ornamental dots</title>
<style>body{background:white;color:#111}</style>
<svg width="500" height="220" viewBox="0 0 500 220" role="img"
     aria-label="Monthly attendance">
  <g aria-hidden="true" fill="#111">
    <circle cx="440" cy="15" r="4"/><circle cx="455" cy="15" r="4"/>
    <circle cx="470" cy="15" r="4"/>
  </g>
  <polyline fill="none" stroke="#ddd" stroke-width="3"
    points="40,160 150,70 260,120 450,50"/>
  <g fill="#111"><text x="40" y="210">Jan</text>
    <text x="240" y="210">Feb</text><text x="440" y="210">Mar</text></g>
</svg></html>
