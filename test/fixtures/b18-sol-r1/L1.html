<!doctype html><html lang="en">
<meta charset="utf-8"><title>Child thumb switch</title>
<style>
body{background:white;color:#111}
button{position:relative;width:44px;height:24px;padding:0;
  border:0;border-radius:12px;background:#eee}
.thumb{position:absolute;left:3px;top:3px;width:18px;height:18px;
  border-radius:50%;background:#111}
[aria-checked=true] .thumb{left:23px}
</style>
<button role="switch" aria-label="Email alerts" aria-checked="false"
 onclick="this.setAttribute('aria-checked',String(this.getAttribute('aria-checked')!=='true'))">
  <span class="thumb" aria-hidden="true"></span>
</button></html>
