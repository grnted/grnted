<!doctype html><html lang="en">
<meta charset="utf-8"><title>OKLCH control</title>
<style>
body{background:oklch(.98 0 0);color:oklch(.2 0 0)}
button{position:relative;width:44px;height:24px;border:0;
  border-radius:12px;background:oklch(.2 0 0)}
button::after{content:"";position:absolute;left:3px;top:3px;
  width:18px;height:18px;border-radius:50%;background:oklch(.98 0 0)}
</style>
<button role="switch" aria-label="Notifications" aria-checked="false"></button>
</html>
