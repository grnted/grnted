<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Apply</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Apply</h1><form id='sb' novalidate><div id='a1'><label for='se'>Email</label><input id='se' type='email' name='se' autocomplete='email'><p><button type='button' id='sn'>Next</button></p></div><div id='a2' hidden><p>Your email: <span id='sum'></span></p><label for='se2'>Re-enter your email</label><input id='se2' type='email' name='se2' autocomplete='off'><p><button>Submit</button></p></div></form></main><script>document.getElementById('sn').onclick=()=>{const v=document.getElementById('se').value;if(!v)return;document.getElementById('sum').textContent=v;document.getElementById('a1').hidden=true;document.getElementById('a2').hidden=false;};document.getElementById('sb').addEventListener('submit',e=>e.preventDefault());</script></body></html>
