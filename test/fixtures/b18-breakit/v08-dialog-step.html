<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request a call</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Request a call</h1><form id='dw'><label for='dp'>Phone</label><input id='dp' type='tel' name='dp' autocomplete='tel'><p><button type='button' id='dg'>Continue</button></p></form><dialog id='dd'><form method='dialog'><label for='dp2'>Phone number again</label><input id='dp2' type='tel' name='dp2'><button>Done</button></form></dialog></main><script>document.getElementById('dg').addEventListener('click',()=>{if(!document.getElementById('dp').value)return;document.getElementById('dw').hidden=true;document.getElementById('dd').show();});</script></body></html>
