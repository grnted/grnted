<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Sign up</h1><form id='vf' novalidate><label for='vn'>Your name</label><input id='vn' name='vn' autocomplete='name'><small class='error' id='e1'></small><label for='vp'>Phone</label><input id='vp' type='tel' name='vp' autocomplete='tel'><small class='error' id='e2'></small><p><button>Join</button></p></form></main><script>document.getElementById('vf').addEventListener('submit',e=>{e.preventDefault();document.getElementById('e1').textContent=document.getElementById('vn').value?'':'This is required.';document.getElementById('e2').textContent=document.getElementById('vp').value?'':'This is required.';});</script></body></html>
