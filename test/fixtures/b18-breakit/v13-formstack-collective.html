<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Volunteer</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Volunteer</h1><form id='fs' novalidate><div class='fsRow'><label for='f1' class='fsLabel'>Name</label><input id='f1' name='f1' class='fsField' autocomplete='name'></div><div class='fsRow'><label for='f2' class='fsLabel'>Email</label><input id='f2' type='email' name='f2' class='fsField' autocomplete='email'></div><p><button>Submit</button></p><p id='fe' role='alert'></p></form></main><script>document.getElementById('fs').addEventListener('submit',e=>{e.preventDefault();let bad=false;['f1','f2'].forEach(id=>{const f=document.getElementById(id);const b=!f.value;f.style.borderColor=b?'#c00':'';if(b)bad=true;});document.getElementById('fe').textContent=bad?'Please fill in all required fields.':'Thanks!';});</script></body></html>
