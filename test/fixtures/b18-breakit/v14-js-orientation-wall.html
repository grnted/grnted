<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Visit planner</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Visit planner</h1><section id='vp'><div id='wall' hidden>Rotate your device to landscape to use the planner.</div><div id='cont'><p>Plan your visit: pick a branch, a day and a time. Walk-in help runs every weekday morning, and quiet rooms are available by request at every branch.</p></div></section></main><script>function f(){const p=innerHeight>innerWidth;document.getElementById('wall').hidden=!p;document.getElementById('cont').hidden=p;}f();addEventListener('resize',f);</script></body></html>
