<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a room</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Book a room</h1><form id='wd' novalidate><label for='wn'>Your name</label><input id='wn' name='wn' autocomplete='name'><label for='wt'>Date</label><input id='wt' name='wt' aria-describedby='we'> <span id='we'></span><p><button>Book</button></p><p id='r' role='status'></p></form></main><script>document.getElementById('wd').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('wt').value;const ok=/^\d{4}-\d{2}-\d{2}$/.test(v);document.getElementById('we').textContent=v&&!ok?'Wrong date':'';document.getElementById('r').textContent=ok?'Booked.':'';});</script></body></html>
