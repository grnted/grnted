<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Get updates</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Get updates</h1><form class='hs-form'><div class='hs-form-field'><label for='hf'><span>First name</span><span class='hs-form-required'>*</span></label><input id='hf' name='firstname' class='hs-input' autocomplete='given-name' required></div><div class='hs-form-field'><label for='hl'><span>Last name</span><span class='hs-form-required'>*</span></label><input id='hl' name='lastname' class='hs-input' autocomplete='family-name' required></div><input type='submit' value='Submit'></form></main></body></html>
