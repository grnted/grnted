<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Parks</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Parks</h1><div><label><input type='checkbox' id='open'> Open now</label></div><p id='cnt'>12 parks</p><ul id='pl'><li data-o='1'>Cedar</li><li data-o='0'>Alder</li></ul></main><script>document.getElementById('open').addEventListener('change',e=>{document.getElementById('cnt').textContent=(e.target.checked?7:12)+' parks';});</script></body></html>
