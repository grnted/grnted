<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Portal login</title></head>
<body><main><h1>Portal login</h1>
<form onsubmit="event.preventDefault()">
 <label for="email">Email address</label>
 <input id="email" type="email" autocomplete="username">
 <label for="password">Password</label>
 <input id="password" type="password" autocomplete="current-password">
 <button>Sign in</button>
</form></main>
<script>
document.getElementById('email').addEventListener('paste', e => {
  const value = e.clipboardData.getData('text/plain').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) e.preventDefault();
});
</script></body></html>
