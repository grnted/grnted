<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Request</h1><form id='tt' novalidate><label for='tn'>Your name</label><input id='tn' name='tn' autocomplete='name'><label for='tm'>Request</label><textarea id='tm' name='tm'></textarea><p><button>Send</button></p></form></main><script>document.getElementById('tt').addEventListener('submit',e=>{let bad=false;['tn','tm'].forEach(id=>{const f=document.getElementById(id);if(!f.value){f.style.outline='3px solid #c00';f.title='Required';bad=true;}});if(bad)e.preventDefault();});</script></body></html>
