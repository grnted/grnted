<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Request</h1><form id='tt' novalidate><label for='tn'>Your name</label><input id='tn' name='tn' autocomplete='name' aria-describedby='te'><span id='te'></span><p><button>Send</button></p><p id='ok' role='status'></p></form></main><script>document.getElementById('tt').addEventListener('submit',e=>{e.preventDefault();const f=document.getElementById('tn');f.title=f.value?'':'Required';document.getElementById('te').textContent=f.value?'':'Enter your name.';document.getElementById('ok').textContent=f.value?'Sent.':'';});</script></body></html>
