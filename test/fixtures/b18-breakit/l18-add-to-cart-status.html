<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Shop</h1><ul><li>Park pass <button type='button' class='add'>Add to cart</button></li></ul><p id='msg' role='status'></p></main><script>document.querySelectorAll('.add').forEach(b=>b.addEventListener('click',()=>{document.getElementById('msg').textContent='Park pass added to your cart.';}));</script></body></html>
