<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Contact</h1><form class='elementor-form'><div class='elementor-field-group'><label for='fe' class='elementor-field-label elementor-screen-only'>Email</label><input id='fe' type='email' name='fe' placeholder='Email' autocomplete='email' class='elementor-field'></div><div class='elementor-field-group'><label for='fm' class='elementor-field-label elementor-screen-only'>Message</label><textarea id='fm' name='fm' placeholder='Message'></textarea></div><button>Send</button></form></main></body></html>
