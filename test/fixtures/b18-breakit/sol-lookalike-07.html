<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Parking permit</title></head>
<body><main><h1>Parking permit</h1>
<form onsubmit="event.preventDefault()">
 <label for="type">Permit type</label>
 <select id="type" aria-describedby="duration">
  <option value="monthly">Monthly</option><option value="quarterly">Quarterly</option>
 </select>
 <p id="duration">30 days</p>
</form></main>
<script>
document.getElementById('type').onchange = e => {
  document.getElementById('duration').textContent =
    e.target.value === 'monthly' ? '30 days' : '90 days';
};
</script></body></html>
