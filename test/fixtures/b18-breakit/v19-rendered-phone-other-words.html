<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request a call</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Request a call</h1><form id='w'><div id='b'><label for='p1'>Phone</label><input id='p1' type='tel' name='p1' autocomplete='tel'><label for='n1'>Full name</label><input id='n1' name='n1' autocomplete='name'></div><p><button type='button' id='go'>Continue</button></p></form></main><script>document.getElementById('go').addEventListener('click',()=>{const v=document.getElementById('p1').value;if(!v)return;document.getElementById('b').innerHTML="<h2>How to reach you</h2><label for='p2'>Phone number (we will text you)</label><input id='p2' type='tel' name='p2' autocomplete='off'>";document.getElementById('go').textContent='Send';});</script></body></html>
