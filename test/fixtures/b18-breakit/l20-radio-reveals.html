<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Account</h1><form id='ra'><fieldset><legend>Account type</legend><label><input type='radio' name='t' value='h' checked> Household</label><label><input type='radio' name='t' value='b'> Business</label></fieldset><div id='biz' hidden><label for='tax'>Tax ID</label><input id='tax' name='tax'></div><p><button>Continue</button></p></form></main><script>document.querySelectorAll('input[name=t]').forEach(r=>r.addEventListener('change',()=>{document.getElementById('biz').hidden=document.querySelector('input[name=t]:checked').value!=='b';}));</script></body></html>
