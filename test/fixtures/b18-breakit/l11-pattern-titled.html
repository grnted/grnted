<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Find a permit</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:10px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .elementor-screen-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Find a permit</h1><form id='pe'><label for='pn'>Your name</label><input id='pn' name='pn' autocomplete='name' required><label for='pp'>Permit</label><input id='pp' name='pp' pattern='[A-Z]{2}-[0-9]{4}' title='Two capital letters, a dash and four digits, like AB-1234' required><p><button>Find</button></p><p id='r' role='status'></p></form></main><script>document.getElementById('pe').addEventListener('submit',e=>{e.preventDefault();document.getElementById('r').textContent='Permit found.';});</script></body></html>
