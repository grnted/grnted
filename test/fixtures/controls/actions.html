<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your account</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Your account</h1>
<p>Signed in as a resident.</p>
<button id="del" type="button">Delete my account</button>
<div id="out" class="ctl" role="button" tabindex="0">Log out</div>
<a id="pay" href="/pay.html">Pay a bill</a>
<form action="/subscribe" method="post"><input name="email" aria-label="Email"><button id="sub">Sign up</button></form>
<p id="log"></p>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
var hit = function (what) { return function () { document.getElementById('log').textContent = what; fetch('/api/' + what, { method: 'POST' }); }; };
document.getElementById('del').addEventListener('click', hit('delete'));
document.getElementById('out').addEventListener('click', hit('logout'));
document.getElementById('pay').addEventListener('click', hit('pay'));
document.getElementById('sub').addEventListener('click', hit('subscribe'));
</script>
</body>
</html>
