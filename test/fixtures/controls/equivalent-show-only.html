<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plot plan</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
button { font: inherit; padding: 6px 12px; }
.tile { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.tile:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><a href="/">Marsh Lane Allotments</a> <a href="/about.html">About</a> <button type="button" id="planbtn" aria-controls="plan">Show the plan</button></header>
<main>
<h1>Plot plan</h1>
<!-- Clean: the tile shows and hides the plan with the pointer only; the button in the header shows it with the keyboard (it only shows: pressed while the plan is in view, it does nothing). The function can be reached with the keyboard. -->
<p><span class="tile" role="button" tabindex="0" id="tile" aria-controls="plan">Plan of the plots</span></p>
<p id="hint"></p>
<div id="plan" hidden><p>Plots 1 to 14 run along the hedge; 15 to 30 face the gate.</p></div>
<p id="other"></p>
</main>
<footer><a href="/contact.html">Contact</a></footer>
<script>
var plan = document.getElementById('plan');
function flip() { plan.hidden = !plan.hidden; }
document.getElementById('tile').addEventListener('pointerup', flip);
document.getElementById('planbtn').addEventListener('click', function () { plan.hidden = false; });
</script>
</body>
</html>
