<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order a soil test</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }


</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Order a soil test</h1>
<p>This draft is kept for <span id="left">50 seconds</span>.</p>
<div id="attach" class="ctl" role="button" tabindex="0">Add a field sketch</div>
<p id="attach-out" class="note" role="status"></p>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
var n = 45;
setInterval(function () { n = n > 1 ? n - 1 : 45; document.getElementById('left').textContent = n + ' seconds'; }, 1000);
var go = function () { document.getElementById('attach-out').textContent = 'Field sketch added to this order.'; };
var a = document.getElementById('attach');
a.addEventListener('click', go);
a.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
</script>
</body>
</html>
