<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service updates</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }


</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Service updates</h1>
<p id="clock">Updated at 10:00:00.</p>
<p id="rot">Route 4 is on time.</p>
<div id="inert" class="ctl" role="button" tabindex="0">Service map legend</div>
<button id="quiet" type="button">Mark as read</button>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
var n = 0;
setInterval(function () {
  n++;
  document.getElementById('clock').textContent = 'Updated at 10:00:0' + (n % 10) + '.';
  document.getElementById('rot').textContent = n % 2 ? 'Route 9 was added to the detour list.' : 'Route 4 is on time.';
}, 1100);
document.getElementById('inert').addEventListener('mousedown', function () {});
document.getElementById('quiet').addEventListener('click', function () {});
</script>
</body>
</html>
