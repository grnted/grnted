<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parcel map</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
.modal { position: fixed; inset: 20px; background: #fff; border: 2px solid #333; padding: 12px; }
iframe { width: 560px; height: 260px; border: 1px solid #888; }
.cover { position: absolute; left: 24px; width: 600px; height: 280px; background: #fff; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<main>
<button id="lookup" type="button">Look up a parcel</button>
<div id="dlg" class="modal" role="dialog" aria-modal="true" aria-label="Parcel lookup" hidden>
<label for="pn">Parcel number</label> <input id="pn">
<button type="button" id="find">Find parcel</button>
</div>
</main>
<script>
var dlg = document.getElementById('dlg');
document.getElementById('lookup').addEventListener('click', function () { dlg.hidden = false; document.getElementById('pn').focus(); });
dlg.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { e.preventDefault(); dlg.hidden = true; document.getElementById('lookup').focus(); return; }
  if (e.key !== 'Tab') return;
  e.preventDefault();
  (document.activeElement === document.getElementById('pn') ? document.getElementById('find') : document.getElementById('pn')).focus();
});
</script>
</body>
</html>
