<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plot plan</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
button { font: inherit; padding: 6px 12px; }
.tile { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.tile:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><a href="/">Marsh Lane Allotments</a> <a href="/about.html">About</a> <button type="button" id="planbtn">Water rota</button></header>
<main>
<h1>Plot plan</h1>
<!-- Fails 2.1.1: the tile and the header button both write into the same line, but they say different things: the header button is no keyboard way to what the tile does. -->
<p><span class="tile" role="button" tabindex="0" id="tile">Plan of the plots</span></p>
<p id="hint"></p>
<p id="line" role="status"></p>
<p id="other"></p>
</main>
<footer><a href="/contact.html">Contact</a></footer>
<script>
var line = document.getElementById('line');
function flip() { line.textContent = line.textContent === 'Plots 1 to 14 run along the hedge.' ? '' : 'Plots 1 to 14 run along the hedge.'; }
document.getElementById('tile').addEventListener('pointerup', flip);
document.getElementById('planbtn').addEventListener('click', function () { line.textContent = line.textContent === 'Watering is on Tuesdays and Fridays.' ? '' : 'Watering is on Tuesdays and Fridays.'; });
</script>
</body>
</html>
