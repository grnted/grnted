<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plot plan</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
button { font: inherit; padding: 6px 12px; }
.tile { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.tile:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><a href="/">Marsh Lane Allotments</a> <a href="/about.html">About</a></header>
<main>
<h1>Plot plan</h1>
<!-- Not testable: the tile closes the note with the pointer only, and its title names Esc, which closes the note too. Once the test has clicked, the note is gone and cannot be brought back, so the key cannot be tried from where the click started: neither failed nor passed. -->
<p><span class="tile" role="button" tabindex="0" id="tile" title="Close the note (Esc)">Close the note</span></p>
<p id="hint"></p>
<div id="plan"><p>The water is off on Sunday morning while the tank is cleaned.</p></div>
<p id="other"></p>
</main>
<footer><a href="/contact.html">Contact</a></footer>
<script>
var plan = document.getElementById('plan');
function flip() { plan.hidden = true; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') flip(); });
document.getElementById('tile').addEventListener('pointerup', flip);

</script>
</body>
</html>
