<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watering rota</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.note { min-height: 1.5em; margin: 8px 0; }
button { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<header><a href="/">Marsh Lane Allotments</a> <a href="/about.html">About</a></header>
<main>
<h1>Watering rota</h1>
<p>Each plot takes one evening a week in dry spells.</p>
<!-- Clean: the message is the text of a component whose shadow root wraps its slot in role="status". -->
<p><button id="keep" type="button">Keep my evening</button></p>
<rota-note id="spot" class="note"></rota-note>
</main>
<footer><a href="/contact.html">Contact</a></footer>
<script>
customElements.define('rota-note', class extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<div role="status"><slot></slot></div>'; }
});
document.getElementById('keep').addEventListener('click', function () { document.getElementById('spot').textContent = 'Your evening is saved.'; });
</script>
</body>
</html>
