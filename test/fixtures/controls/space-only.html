<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mulch delivery</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Mulch delivery</h1>
<div id="opt" class="ctl" role="checkbox" aria-checked="false" tabindex="0">Text me the night before</div>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
var o = document.getElementById('opt');
var flip = function () { o.setAttribute('aria-checked', o.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); };
o.addEventListener('click', flip);
o.addEventListener('keyup', function (e) { if (e.key === ' ') flip(); });
o.addEventListener('keydown', function (e) { if (e.key === ' ') e.preventDefault(); });
</script>
</body>
</html>
