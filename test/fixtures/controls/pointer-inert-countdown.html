<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Renew a dog licence</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Renew a dog licence</h1>
<p>Your answers are kept for <span id="left">50 seconds</span>.</p>
<div id="keep" class="ctl" role="button" tabindex="0">Keep my answers</div>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
// A countdown the page ticks by itself, and beside it a control whose click changes nothing anyone sees (it only
// notes the click on itself, for the page's own bookkeeping): the click must never be credited with the tick.
var n = 45, kept = 0;
setInterval(function () { n = n > 1 ? n - 1 : 45; document.getElementById('left').textContent = n + ' seconds'; }, 1000);
document.getElementById('keep').addEventListener('click', function () { kept++; this.setAttribute('data-kept', String(kept)); });
</script>
</body>
</html>
