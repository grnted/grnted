<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dig days</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Dig days</h1>
<div id="views">
<div role="tablist" aria-label="Meeting views">
<button id="t0" role="tab" aria-selected="true" aria-controls="p0" tabindex="0">Upcoming</button>
<button id="t1" role="tab" aria-selected="false" aria-controls="p1" tabindex="-1">Past</button>
<button id="t2" role="tab" aria-selected="false" aria-controls="p2" tabindex="-1">Minutes</button>
</div>
<section id="p0" role="tabpanel" aria-labelledby="t0"><p>The next meeting is on the second Tuesday.</p></section>
<section id="p1" role="tabpanel" aria-labelledby="t1" hidden><p>Last month the board met twice.</p></section>
<section id="p2" role="tabpanel" aria-labelledby="t2" hidden><p>Minutes are posted within ten days.</p></section>
</div>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
var tabs = [].slice.call(document.querySelectorAll('[role=tab]'));
var pick = function (tab) {
  tabs.forEach(function (t) { var on = t === tab; t.tabIndex = on ? 0 : -1; t.setAttribute('aria-selected', String(on)); document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
};
tabs.forEach(function (t) {
  t.addEventListener('click', function () { pick(t); });
  t.addEventListener('keydown', function (e) {
    var i = tabs.indexOf(t);
    if (e.key === 'ArrowRight') i = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') i = (i + tabs.length - 1) % tabs.length; else return;
    e.preventDefault(); pick(tabs[i]); tabs[i].focus();
  });
});
</script>
</body>
</html>
