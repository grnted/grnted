<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repair workshop</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }


</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Repair workshop</h1>
<div class="col">
<p>Bring one small item. Volunteers help you mend it.</p>
<p><button type="button" id="about">About the workshop</button></p>
<p id="about-text" hidden>The workshop meets on the first Saturday.</p>
<h2>Choose your table</h2>
<div id="table" class="ctl">Seed table</div>
<p id="choice" class="note" role="status"></p>
<p><a href="/workshop/register.html">Book a seat</a></p>
</div>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
document.getElementById('table').addEventListener('click', function () { document.getElementById('choice').textContent = 'Seed table chosen.'; });
document.getElementById('about').addEventListener('click', function () { var t = document.getElementById('about-text'); t.hidden = !t.hidden; });
</script>
</body>
</html>
