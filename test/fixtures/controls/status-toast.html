<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route 7</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }
.toast { position: fixed; right: 16px; bottom: 16px; padding: 8px 12px; background: #1c1c1c; color: #fff; }
</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Route 7</h1>
<p>Route 7 runs every 20 minutes.</p>
<button id="copy" type="button">Copy stop number</button>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
document.getElementById('copy').addEventListener('click', function () {
  var old = document.querySelector('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Bed number copied.'; document.body.appendChild(t);
});
</script>
</body>
</html>
