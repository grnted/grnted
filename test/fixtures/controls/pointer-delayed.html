<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watering reminders</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }


</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Watering reminders</h1>
<div id="remind" class="ctl" role="button" tabindex="0">Save my reminder choice</div>
<p id="remind-out" class="note" role="status"></p>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
document.getElementById('remind').addEventListener('pointerup', function () {
  setTimeout(function () { document.getElementById('remind-out').textContent = 'Your reminder choice is saved for this visit.'; }, 60);
});
</script>
</body>
</html>
