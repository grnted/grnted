<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Town hall</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.ctl { display: inline-block; padding: 8px 14px; border: 2px solid #1d4d3f; border-radius: 4px; background: #e7f2ee; cursor: pointer; }
.ctl:focus { outline: 3px solid #0b57d0; outline-offset: 2px; }
.note { min-height: 1.5em; margin: 8px 0; }
[hidden] { display: none !important; }

</style>
</head>
<body>
<header><a href="/">Riverbend Township</a> <a href="/about.html">About</a></header>
<main>
<h1>Town hall</h1>
<div class="tiles">
<div class="tile ctl" role="button" tabindex="0" data-show="hours">Opening hours</div>
<div id="hours" hidden>Open weekdays from 8 to 5.</div>
</div>
</main>
<footer><a href="/contact.html">Contact</a> <a href="/privacy.html">Privacy</a></footer>
<script>
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-show]');
  if (t) document.getElementById(t.getAttribute('data-show')).hidden = false;
});
</script>
</body>
</html>
