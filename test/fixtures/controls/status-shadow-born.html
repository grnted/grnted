<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watering rota</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fff; }
header, main, footer { padding: 16px 24px; }
.note { min-height: 1.5em; margin: 8px 0; }
button { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<header><a href="/">Marsh Lane Allotments</a> <a href="/about.html">About</a></header>
<main>
<h1>Watering rota</h1>
<p>Each plot takes one evening a week in dry spells.</p>
<!-- Not testable (review r2, finding 7): one click handler puts a status region into the shadow root and the message into the host. The region came with its message (ARIA22 asks for it to be there first), but what happens inside a shadow root is not seen by the test: it cannot say the message is announced. -->
<p><button id="keep" type="button">Keep my evening</button></p>
<div id="spot" class="note"></div>
</main>
<footer><a href="/contact.html">Contact</a></footer>
<script>
var root = document.getElementById('spot').attachShadow({ mode: 'open' });
root.innerHTML = '<slot></slot>';
document.getElementById('keep').addEventListener('click', function () {
  root.innerHTML = '<div role="status"><slot></slot></div>';
  document.getElementById('spot').textContent = 'Your evening is saved.';
});
</script>
</body>
</html>
