<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lending desk (text that changes by itself)</title>
<style>
  section { margin: 0 0 32px; }
  @keyframes wink { 0%, 49% { visibility: visible; } 50%, 100% { visibility: hidden; } }
  .wink { animation: wink 0.6s steps(1) infinite; }
</style></head>
<body>
<main>
<h1>Lending desk</h1>

<!-- A countdown next to the form ticks on its own: it is not a message the form shows when it is sent. -->
<section>
  <h2>Hold a kit</h2>
  <p id="refresh">The list of kits refreshes in <span id="tick">30 seconds</span>.</p>
  <form id="hold" aria-label="Hold a kit" action="/hold-kit" method="post" novalidate>
    <p><label for="kit">Kit name</label><br><input id="kit" name="kit" autocomplete="off"></p>
    <button type="submit">Hold it</button>
  </form>
</section>

<!-- A notice that a script blinks, and one a stylesheet blinks without end: neither is the form's message. -->
<section>
  <h2>Plan a visit</h2>
  <p id="blink">Winter hours start on the first Monday.</p>
  <p class="wink">Gate B is the step-free way in.</p>
  <form id="visit" aria-label="Plan a visit" action="/visit-plan" method="post" novalidate>
    <p><label for="day">Day of your visit</label><br><input id="day" name="day" autocomplete="off"></p>
    <button type="submit">Plan it</button>
  </form>
</section>

<!-- Look-alike that still fails 4.1.3: a steady confirmation the form shows, in no live region, focus left where it was. -->
<section>
  <h2>Save for later</h2>
  <form id="save" aria-label="Save for later" action="/save-draft" method="post" novalidate>
    <p><label for="note">Note to yourself (optional)</label><br><input id="note" name="note" autocomplete="off"></p>
    <button type="submit">Save</button>
  </form>
  <div id="saved"></div>
</section>
</main>
<script>
  let left = 30;
  setInterval(() => { left = left > 1 ? left - 1 : 30; document.getElementById('tick').textContent = left + ' seconds'; }, 400);
  setInterval(() => { const b = document.getElementById('blink'); b.style.visibility = b.style.visibility === 'hidden' ? 'visible' : 'hidden'; }, 400);
  for (const id of ['hold', 'visit']) document.getElementById(id).addEventListener('submit', (e) => { e.preventDefault(); });
  document.getElementById('save').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('saved').textContent = 'Your note is kept on this device until you come back.';
  });
</script>
</body>
</html>
