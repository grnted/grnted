<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in (paste blocked)</title></head>
<body>
<main>
<h1>Sign in</h1>
<form action="/login" method="post">
  <p><label for="user">Username</label><br><input id="user" name="user" autocomplete="username" required></p>
  <p><label for="pw">Password</label><br><input id="pw" name="pw" type="password" autocomplete="off" onpaste="return false" required></p>
  <button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
