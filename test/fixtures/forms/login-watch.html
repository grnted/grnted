<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in (watches its password field)</title></head>
<body>
<main>
<h1>Staff sign in</h1>
<form action="/staff-login" method="post" novalidate>
  <p><label for="lw-user">Email</label><br><input id="lw-user" name="user" type="email" autocomplete="username" aria-describedby="lw-err"></p>
  <p id="lw-err" role="alert"></p>
  <p><label for="lw-pw">Password</label><br><input id="lw-pw" name="pw" type="password" autocomplete="current-password"></p>
  <p><label for="lw-code">Verification code</label><br><input id="lw-code" name="code" autocomplete="one-time-code" inputmode="numeric"></p>
  <button type="submit">Sign in</button>
</form>
</main>
<script>
  // Test fixture: tells the test server (with a plain image request) if anything but the paste test
  // is ever put in the password or code field.
  const report = (name) => { new Image().src = '/credential-typed-' + name + '.gif'; };
  for (const [id, pasted] of [['lw-pw', 'grntedtest paste'], ['lw-code', '000000']]) {
    const el = document.getElementById(id);
    const check = () => { if (el.value && el.value !== pasted) report(id); };
    el.addEventListener('input', check);
    el.addEventListener('change', check);
    document.querySelector('form').addEventListener('submit', (e) => { check(); e.preventDefault(); });
  }
  document.addEventListener('input', (e) => { e.target.dataset.typed = '1'; }, true);
  // Client-side errors, so the test goes on to try wrong formats.
  document.querySelector('form').addEventListener('submit', () => {
    const user = document.getElementById('lw-user').value;
    document.getElementById('lw-err').textContent = !user ? 'Enter your email address' : user.includes('@') ? '' : 'Enter an email address like name@example.com';
  });
</script>
</body>
</html>
