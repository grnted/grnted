<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Search fields labelled by a Search button (G167)</title></head>
<body>
<header>
  <!-- A site search posted to the server, its button named Search: the button labels the field (G167). -->
  <form action="/" method="post"><input name="kw2" placeholder="Search books"> <button type="submit">Search</button></form>
  <!-- A field outside any form beside an icon button whose name is Search (G167). -->
  <div class="site-search"><input name="sq2" placeholder="Site Search"> <button type="button" aria-label="Search"><svg width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#000"/></svg></button></div>
</header>
<main><h1>Catalog</h1><p>Find books, films and more.</p></main>
</body>
</html>
