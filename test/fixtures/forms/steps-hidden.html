<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Greenhouse key (two steps, the first one kept hidden)</title></head>
<body>
<main>
<h1>Greenhouse key</h1>
<!-- Step two asks to confirm the e-mail address. The first step is still in the page, hidden, and the numbered
     step buttons above the form show it again: the first answer is on the page, and something may bring it
     back. Whether that makes it available to select is not for a rule to say: undecided, never failed. -->
<ol id="steps"><li><button type="button" id="g-one">1. About you</button></li><li><button type="button" id="g-two">2. Confirm</button></li></ol>
<form id="greenhouse" action="/greenhouse" method="post">
  <fieldset id="g1"><legend>About you</legend>
    <p><label for="g-name">Full name *</label><br><input id="g-name" name="g-name" autocomplete="name" required></p>
    <p><label for="g-email">Email *</label><br><input id="g-email" name="email" type="email" autocomplete="email" required></p>
    <button type="button" id="g-next">Next</button>
  </fieldset>
  <fieldset id="g2" hidden><legend>Confirm</legend>
    <p><label for="g-email2">Confirm email *</label><br><input id="g-email2" name="confirm-email" type="email" autocomplete="off" required></p>
    <button type="submit">Ask for a key</button>
  </fieldset>
</form>
</main>
<script>
  const one = document.getElementById('g1'); const two = document.getElementById('g2');
  const show = (n) => { one.hidden = n !== 1; two.hidden = n !== 2; };
  document.getElementById('g-next').addEventListener('click', () => {
    if (![...one.querySelectorAll('input')].every((i) => i.checkValidity())) return;
    show(2); document.getElementById('g-email2').focus();
  });
  document.getElementById('g-one').addEventListener('click', () => show(1));
  document.getElementById('g-two').addEventListener('click', () => { if ([...one.querySelectorAll('input')].every((i) => i.checkValidity())) show(2); });
</script>
</body>
</html>
