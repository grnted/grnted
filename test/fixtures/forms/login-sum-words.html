<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in (a sum in words)</title></head>
<body>
<main>
<h1>Member log in</h1>
<!-- A calculation asked in words before the account opens: a cognitive function test with no other way in. -->
<form action="/login" method="post">
  <p><label for="member">Member number</label><br><input id="member" name="member" autocomplete="username" required></p>
  <p><label for="pin">PIN</label><br><input id="pin" name="pin" type="password" autocomplete="current-password" required></p>
  <p><label for="check">What is twelve plus six?</label><br><input id="check" name="check" inputmode="numeric" autocomplete="off" required></p>
  <button type="submit">Log in</button>
</form>
</main>
</body>
</html>
