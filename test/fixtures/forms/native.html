<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Library card (browser validation)</title></head>
<body>
<main>
<h1>Ask for a library card</h1>
<form action="/card" method="post">
  <p><label for="lc-name">Full name *</label><br><input id="lc-name" name="name" autocomplete="name" required></p>
  <p><label for="lc-email">Email *</label><br><input id="lc-email" name="email" type="email" autocomplete="email" required></p>
  <button type="submit">Ask</button>
</form>
</main>
</body>
</html>
