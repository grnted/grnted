<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Language (reloads on input)</title></head>
<body>
<main>
<h1>Choose a language</h1>
<p><label for="lang">Language</label>
<select id="lang" onchange="location.reload()"><option value="en">English</option><option value="es">Español</option></select></p>
</main>
</body>
</html>
