<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office hours (a card around a button element with a closed root)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; color: #1a1a1a; background: #ffffff; }
a { color: #0b4fb3; }
table { border-collapse: collapse; }
th, td { border: 1px solid #595959; padding: 4px 10px; text-align: left; }
.chart { width: 640px; max-width: 100%; }

</style>
</head>
<body>
<main>
<h1>Office hours (a card around a button element with a closed root)</h1>
<div id="card" style="cursor:pointer;border:1px solid #595959;padding:8px 12px;max-width:30rem">
<p>The district office is in the Civic Center, room 210.</p>
<hours-button id="hours-button"><template shadowrootmode="closed"><button type="button"><slot></slot></button></template>Show office hours</hours-button>
</div>
<p id="hours" hidden>8 am to 4 pm, Monday to Friday.</p>
<script>
document.getElementById('card').addEventListener('click', function () { var h = document.getElementById('hours'); h.hidden = !h.hidden; });
</script>
<p><a href="/index.html">All reports</a></p>
</main>
</body>
</html>
