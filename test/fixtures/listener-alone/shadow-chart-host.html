<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget (a chart element)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; color: #1a1a1a; background: #ffffff; }
a { color: #0b4fb3; }
table { border-collapse: collapse; }
th, td { border: 1px solid #595959; padding: 4px 10px; text-align: left; }
.chart { width: 640px; max-width: 100%; }

</style>
</head>
<body>
<main>
<h1>Budget (a chart element)</h1>
<p>Spending by fund this year, in millions of dollars.</p>
<budget-chart id="budget" role="presentation" style="display:block;width:600px;height:240px;cursor:pointer"></budget-chart>
<table><caption>Spending by fund</caption><thead><tr><th scope="col">Fund</th><th scope="col">Millions</th></tr></thead><tbody><tr><td>General</td><td>41</td></tr><tr><td>Roads</td><td>18</td></tr><tr><td>Parks</td><td>9</td></tr></tbody></table>
<p><a href="/index.html">All reports</a></p>
</main>
<script>
customElements.define('budget-chart', class extends HTMLElement {
  connectedCallback() {
    var root = this.attachShadow({ mode: 'open' });
    root.innerHTML = '<canvas width="600" height="240" role="img" aria-label="Spending by fund: general 41, roads 18, parks 9 million dollars"></canvas>';
    var g = root.querySelector('canvas').getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 600, 240);
    [41, 18, 9].forEach(function (v, i) { g.fillStyle = '#2c6fbb'; g.fillRect(60 + i * 180, 220 - v * 5, 120, v * 5); });
    this.addEventListener('click', function () {});
  }
});
</script>
</body>
</html>
