<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office location (an icon and its label in a shadow root)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; color: #1a1a1a; background: #ffffff; }
a { color: #0b4fb3; }
table { border-collapse: collapse; }
th, td { border: 1px solid #595959; padding: 4px 10px; text-align: left; }
.chart { width: 640px; max-width: 100%; }

</style>
</head>
<body>
<main>
<h1>Office location (an icon and its label in a shadow root)</h1>
<map-toggle id="map-toggle" role="button" style="display:inline-block;width:480px;height:60px"></map-toggle>
<p id="map-text" hidden>Civic Center, 555 Main Street, second floor, room 210.</p>
<script>
customElements.define('map-toggle', class extends HTMLElement {
  connectedCallback() { this.attachShadow({ mode: 'open' }).innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 200 60" preserveAspectRatio="none" style="vertical-align:middle"><rect width="200" height="60" fill="#dbe8f7"/><path d="M30 5a12 12 0 0 0-12 12c0 10 12 24 12 24s12-14 12-24a12 12 0 0 0-12-12z" fill="#0b4fb3"/></svg>Show the office'; }
});
document.getElementById('map-toggle').addEventListener('click', function () { var m = document.getElementById('map-text'); m.hidden = !m.hidden; });
</script>
<p><a href="/index.html">All reports</a></p>
</main>
</body>
</html>
