<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office location (a label the page put in a button role's slot)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; color: #1a1a1a; background: #ffffff; }
a { color: #0b4fb3; }
table { border-collapse: collapse; }
th, td { border: 1px solid #595959; padding: 4px 10px; text-align: left; }
.chart { width: 640px; max-width: 100%; }

</style>
</head>
<body>
<main>
<h1>Office location (a label the page put in a button role's slot)</h1>
<map-button id="map-button">Show the office</map-button>
<p id="map-text" hidden>Civic Center, 555 Main Street, second floor, room 210.</p>
<script>
customElements.define('map-button', class extends HTMLElement {
  connectedCallback() {
    var r = this.attachShadow({ mode: 'open' });
    r.innerHTML = '<div id="inner" role="button" style="display:inline-block;width:480px;height:60px"><svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 200 60" preserveAspectRatio="none" style="vertical-align:middle"><rect width="200" height="60" fill="#dbe8f7"/></svg><slot></slot></div>';
    r.getElementById('inner').addEventListener('click', function () { var m = document.getElementById('map-text'); m.hidden = !m.hidden; });
  }
});
</script>
<p><a href="/index.html">All reports</a></p>
</main>
</body>
</html>
