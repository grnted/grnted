<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Trail conditions</title><style>body{font:16px/1.5 Arial,sans-serif;color:#222;margin:24px}button,[role=button]{font:inherit;padding:6px 12px}.on{background:#135;color:#fff}[role=button]{display:inline-block;border:1px solid #666;cursor:pointer}</style></head><body><main><h1>Trail conditions</h1><p>Check a trail before you set out. Conditions are updated each morning by the ranger station.</p>
<!-- A toggle button that shows itself switched on (its own colours change, and a marker next to it), and says
     "not pressed" throughout. -->
<div><button id="save" type="button" aria-pressed="false">Add Ridge Loop to my list</button> <span id="save-mark" aria-hidden="true"></span></div>

<!-- A toggle button that stays off: pressing it shows a note next to it (it cannot be switched on here), and
     pressing it again takes the note away. "Not pressed" is true throughout. -->
<div><button id="later" type="button" aria-pressed="false">Tell me when Ridge Loop reopens</button> <span id="later-note"></span></div>

<!-- A collapsed button with no aria-controls: it shows the block after it and still says collapsed. -->
<h2><button id="more" type="button" aria-expanded="false">Ridge Loop closures</button></h2>
<div id="more-panel" hidden><p>The north gate is closed on weekdays until the bridge is repaired.</p></div>

<!-- The same inside a form: a type="button" button cannot send the form. -->
<form action="/report" method="post"><label for="what">What did you see?</label> <input id="what" name="what" autocomplete="off">
<button id="help" type="button" aria-expanded="false" aria-controls="help-panel">What to report</button>
<div id="help-panel" hidden><p>Fallen trees, washed-out steps and missing signs.</p></div>
<button type="submit">Send report</button></form>
</main>
<script>
  document.getElementById('save').addEventListener('click', function () { var m = document.getElementById('save-mark'); m.textContent = m.textContent ? '' : 'On my list'; this.classList.toggle('on'); });
  document.getElementById('later').addEventListener('click', function () { var m = document.getElementById('later-note'); m.textContent = m.textContent ? '' : 'Sign in to be told.'; });
  document.getElementById('more').addEventListener('click', function () { var p = document.getElementById('more-panel'); p.hidden = !p.hidden; });
  document.getElementById('help').addEventListener('click', function () { var p = document.getElementById('help-panel'); p.hidden = !p.hidden; });
</script>
</body></html>
