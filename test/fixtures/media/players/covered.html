<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player under an overlay</title>
<style>body { font: 16px/1.5 Arial, Helvetica, sans-serif; color: #222; background: #fff; margin: 0 24px; } iframe { border: 0; }</style>
</head>
<body>
<main>
<h1>Player under an overlay</h1>
<section>
  <h2>Video</h2>
  <iframe title="Board meeting video" width="480" height="270" src="http://www.youtube.com/embed/capsOn0001" allow="autoplay; encrypted-media"></iframe>
</section>
<div role="dialog" aria-label="Cookie consent" style="position: fixed; inset: 0; background: rgba(255,255,255,.92); padding: 40px">
  <p>We use cookies. Choose your settings.</p>
  <button type="button" id="accept" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0">Accept all</button>
</div>
<script>
  document.getElementById('accept').addEventListener('click', () => fetch('/consent-accepted').catch(() => {}));
</script>
</main>
</body>
</html>
