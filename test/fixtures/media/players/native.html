<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our own videos</title>
<style>body { font: 16px/1.5 Arial, Helvetica, sans-serif; color: #222; background: #fff; margin: 0 24px; } iframe { border: 0; }</style>
</head>
<body>
<main>
<h1>Our own videos</h1>
<section>
  <h2>Described tour</h2>
  <video controls preload="none" width="320" height="180" src="/tour.webm">
    <track kind="captions" src="/tour.vtt" srclang="en" label="English">
    <track kind="descriptions" src="/tour-desc.vtt" srclang="en" label="Descriptions">
  </video>
</section>
<section>
  <h2>Welcome</h2>
  <video controls preload="none" width="320" height="180" src="/welcome.webm"><track kind="captions" src="/welcome.vtt" srclang="en" label="English"></video>
</section>
<section>
  <h2>Background</h2>
  <video muted loop aria-hidden="true" preload="none" width="320" height="180" src="/background.webm"></video>
</section>
</main>
</body>
</html>
