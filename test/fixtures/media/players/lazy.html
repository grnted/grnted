<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy-loaded player</title>
<style>body { font: 16px/1.5 Arial, Helvetica, sans-serif; color: #222; background: #fff; margin: 0 24px; } iframe { border: 0; }</style>
</head>
<body>
<main>
<h1>Lazy-loaded player</h1>
<p>Scroll down for the video.</p>
<div style="height: 2200px"></div>
<section>
  <h2>Video</h2>
  <iframe class="lazy" title="Lazy video" width="480" height="270" data-src="http://www.youtube.com/embed/capsOn0001"></iframe>
</section>
<script>
  // Loads the player when it scrolls into view, as lazy-load plugins do.
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { e.target.src = e.target.dataset.src; io.unobserve(e.target); }
  });
  document.querySelectorAll('iframe.lazy').forEach((f) => io.observe(f));
</script>
</main>
</body>
</html>
