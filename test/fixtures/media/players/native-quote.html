<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A video with its transcript</title>
<style>body { font: 16px/1.5 Arial, Helvetica, sans-serif; color: #222; background: #fff; margin: 0 24px; }</style>
</head>
<body>
<main>
<h1>A video with its transcript</h1>
<section>
  <h2>Welcome</h2>
  <video controls preload="none" width="320" height="180" src="/welcome.webm"><track kind="captions" src="/welcome.vtt" srclang="en" label="English"></video>
  <p>Transcript: Welcome to Fernwood School. The office opens at 8:00.</p>
</section>
<section>
  <h2>Tour</h2>
  <video controls preload="none" width="320" height="180" src="/tour.webm"><track kind="captions" src="/tour.vtt" srclang="en" label="English"></video>
  <p>Transcript: Welcome to the tour of Fernwood School. The office opens at 8:00 every school day. Families can call the front desk with questions.</p>
</section>
</main>
</body>
</html>
