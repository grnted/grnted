<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipped panel</title>
<style>
body { margin: 0; font: 16px/1.5 sans-serif; color: #111; background: #fff; }
#page { position: relative; height: 4981px; }
h1 { margin: 0; padding: 8px; font-size: 20px; }
#panel { position: absolute; top: 400px; left: 0; width: 320px; height: 60px; overflow: auto; background: #f4f4f4; }
#inner { position: relative; height: 400px; }
#news { position: absolute; top: 100px; left: 200px; width: 100px; height: 24px; display: block; color: #036; }
.chat { position: fixed; top: 100px; right: 0; width: 140px; height: 60px; border: 0; background: #0050c8; color: #fff; z-index: 10; }
</style>
</head>
<body>
<!-- A link inside a short box that scrolls by itself (overflow: auto). The page scrolls that box to
     show the link only while the window is scrolled 300-330 px; anywhere else the link is on the
     screen but clipped by its box, so no point of it can be hit. -->
<div id="page"><h1>Updates</h1><p>Latest district updates.</p>
<div id="panel"><div id="inner"><a id="news" href="/news">All news</a></div></div></div>
<button class="chat" type="button" aria-label="Chat with us">?</button>
<script>
var panel = document.getElementById('panel');
addEventListener('scroll', function () { panel.scrollTop = scrollY >= 300 && scrollY <= 330 ? 90 : 0; });
</script>
</body>
</html>
