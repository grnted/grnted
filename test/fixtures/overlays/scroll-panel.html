<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-linked panel</title>
<style>
body { margin: 0; font: 16px/1.5 sans-serif; color: #111; background: #fff; }
#page { position: relative; height: 3331px; }
h1 { margin: 0; padding: 8px; font-size: 20px; }
#panel { position: absolute; top: 400px; left: 0; width: 320px; height: 200px; overflow: auto; background: #f4f4f4; }
#inner { position: relative; height: 2000px; }
#news { position: absolute; top: 600px; left: 200px; width: 100px; height: 24px; display: block; color: #036; }
.chat { position: fixed; top: 140px; right: 0; width: 140px; height: 60px; border: 0; background: #0050c8; color: #fff; z-index: 10; }
</style>
</head>
<body>
<!-- A link inside a box that scrolls by itself (overflow: auto). The page scrolls that box as the
     window scrolls, so scrolling the window to the link's position moves the link out of view:
     the window alone can never place it on screen. -->
<div id="page"><h1>Updates</h1><p>Latest district updates.</p>
<div id="panel"><div id="inner"><a id="news" href="/news">All news</a></div></div></div>
<button class="chat" type="button" aria-label="Chat with us">?</button>
<script>
var panel = document.getElementById('panel');
addEventListener('scroll', function () { panel.scrollTop = Math.max(0, scrollY - 300) * 4; });
</script>
</body>
</html>
