<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Background writes: a tooltip whose address the page already POSTed to on load</title>
<style>body{margin:0;font:1rem/1.4 sans-serif;color:#1a1a1a;background:#fff} main{padding:1rem} #tip{position:absolute;background:#1a1a1a;color:#fff;padding:.5rem} #tip[hidden]{display:none}</style></head>
<body><main><h1>Staff directory</h1><p><button type="button" id="who">Who to call</button></p><div id="tip" hidden></div><p>Call the front office first.</p></main>
<script>
  (function () {
    var off = location.protocol + '//' + (location.hostname === 'localhost' ? '127.0.0.1' : 'localhost') + ':' + location.port;
    var btn = document.getElementById('who'), tip = document.getElementById('tip');
    fetch('/api/tooltip?preload=1', { method: 'POST', body: 'warm' }).catch(function () {});
    btn.addEventListener('mouseenter', function () {
      fetch('/api/tooltip', { method: 'POST', body: 'id=who' }).then(function (r) { return r.text(); }).then(function (t) { tip.textContent = t; tip.hidden = false; }).catch(function () {});
    });
    btn.addEventListener('mouseleave', function () { tip.hidden = true; });
  })();
</script>
</body>
</html>
