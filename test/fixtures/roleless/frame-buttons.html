<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Event calendar</title><style>body{margin:0;font:16px/1.5 sans-serif;color:#1a1a1a;background:#fff}main{padding:8px}.day{display:inline-block;min-width:44px;min-height:44px;margin:2px;border:1px solid #595959;background:#fff;color:#1a1a1a;font:inherit;cursor:pointer}</style></head><body><main><h1 style="font-size:1.1rem;margin:0 0 4px">May</h1>
<!-- Look-alike: the same days as real buttons, and a day made of a div that says it is a button. -->
<div class="month"><button type="button" class="day" data-day="4">4</button><button type="button" class="day" data-day="9">9</button><div class="day" role="button" tabindex="0" data-day="14">14</div></div>
<p id="day-events">Choose a day to see its events.</p></main>
<script>[].forEach.call(document.querySelectorAll('.day'),function(d){d.addEventListener('click',function(){document.getElementById('day-events').textContent='May '+d.getAttribute('data-day')+': book fair in the library.';});});</script></body></html>
