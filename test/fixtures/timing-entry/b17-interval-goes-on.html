<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Arrivals at Main Station</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 44rem; } [hidden] { display: none; } .dlg { position: fixed; inset: 20% 20%; background: #fff; border: 2px solid #333; padding: 1.5rem; } </style></head>
<body><main>
<h1>Arrivals at Main Station</h1>
<div id="board"><p><label>Filter by route <input id="route" name="route"></label></p><p id="times">Route 12: 4 min. Route 24: 9 min.</p></div>
</main>
<script>
  // The board checks for news every 20 s and draws itself again (filter included) when something changed: here on its third check, and on.
  var n = 0;
  setInterval(function () { n++; if (n >= 3) document.getElementById('board').innerHTML = '<p><label>Filter by route <input id="route" name="route"></label></p><p id="times">Route 12: ' + (n % 9 + 1) + ' min. Route 24: 9 min.</p>'; }, 20000);
</script>
</body>
</html>
