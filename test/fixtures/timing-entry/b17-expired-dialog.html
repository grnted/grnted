<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shelter booking</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 44rem; } [hidden] { display: none; } .dlg { position: fixed; inset: 20% 20%; background: #fff; border: 2px solid #333; padding: 1.5rem; } </style></head>
<body><main>
<h1>Shelter booking</h1>
<form id="f" action="/book" method="get"><p><label>What is the gathering for? <input id="what" name="what"></label></p><p><button>Book</button></p></form>
<div id="over" class="dlg" role="dialog" aria-modal="true" aria-labelledby="over-h" hidden><h2 id="over-h">Your session has expired</h2><p>What you entered was not saved.</p><button type="button" id="again">Sign in again</button></div>
</main>
<script>
  // Fifteen minutes after typing starts a box says the session is over; its only button signs in again.
  var t, what = document.getElementById('what');
  what.addEventListener('input', function () { if (!t) t = setTimeout(function () { what.disabled = true; document.getElementById('over').hidden = false; }, 15 * 60 * 1000); });
  document.getElementById('again').addEventListener('click', function () { location.href = 'plain.html'; });
</script>
</body>
</html>
