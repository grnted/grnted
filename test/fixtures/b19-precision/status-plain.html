<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ask the library</title><style>body{font:16px/1.5 Arial,sans-serif;color:#1b1b1b;background:#fff;margin:0 16px}label{display:block}</style></head><body><main><h1>Ask the library</h1><form id="f" action="/request" method="post"><p><label for="n">Your name</label><input id="n" name="n" autocomplete="name"></p><p><label for="q">Your question</label><textarea id="q" name="q"></textarea></p><p><button>Send question</button></p><p id="done"></p></form></main><script>document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); var m = 'Your question was sent. We reply within two working days.'; document.getElementById('done').textContent = m; });</script></body></html>
