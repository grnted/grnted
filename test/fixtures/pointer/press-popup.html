<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pointer cancellation: a new window on press</title></head>
<body><main><h1>Gallery</h1>
<p><button type="button" id="open">Open the gallery</button></p>
</main>
<script>document.getElementById('open').addEventListener('pointerdown', function () { window.open('/about.html'); });</script>
</body>
</html>
