<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendar widget</title></head>
<body><p><button id="next-month" type="button">Next month</button></p><p id="month">October</p>
<script>document.getElementById('next-month').addEventListener('mousedown', function () { document.getElementById('month').textContent = 'November'; });</script>
</body>
</html>
