<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pointer gestures: planted failures</title>
<style>
body{font:16px/1.5 sans-serif;margin:20px}
.car{position:relative;width:600px;height:200px;overflow:hidden;border:1px solid #333}
.track{display:flex;width:1800px;height:200px}
.slide{width:600px;height:200px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.s1{background:#fde}.s2{background:#dfe}.s3{background:#def}
.zoombox{position:relative;width:500px;height:300px;overflow:hidden;border:1px solid #333}
.zoombox img,.zoombox .pic{display:block;width:500px;height:300px;transform-origin:50% 50%;background:repeating-linear-gradient(90deg,#fc9 0 25px,#c96 25px 50px)}
.map{position:relative;width:600px;height:300px;overflow:hidden;border:1px solid #333}
.map-inner{position:absolute;left:0;top:0;width:1200px;height:600px;background:repeating-linear-gradient(45deg,#cde 0 20px,#9ab 20px 40px)}
.sortlist{list-style:none;padding:0;width:400px}
.sortlist li{border:1px solid #333;margin:4px 0;padding:8px;background:#f8f8f8}
.slider{position:relative;width:300px;height:12px;background:#ccc;margin:20px 0}
.thumb{position:absolute;top:-6px;width:24px;height:24px;background:#036;border-radius:50%}
</style>
</head>
<body><main><h1>Pointer gestures</h1>
<h2>Swipe only</h2>
<div class="car" id="swipe-only"><div class="track" id="t1"><div class="slide s1">Spring concert</div><div class="slide s2">Science fair</div><div class="slide s3">Field day</div></div></div>
<h2>Pinch only</h2>
<div class="zoombox" id="pinch-only"><div class="pic" id="pic" role="img" aria-label="Floor plan"></div></div>
<h2>Swipe with slide buttons</h2>
<div class="car" id="swipe-ok"><div class="track" id="t2"><div class="slide s1">Art show</div><div class="slide s2">Book fair</div><div class="slide s3">Play</div></div></div>
<p><button type="button" class="dot" data-n="0">Slide 1</button> <button type="button" class="dot" data-n="1">Slide 2</button> <button type="button" class="dot" data-n="2">Slide 3</button></p>
</main>
<script>
  var $ = function (id) { return document.getElementById(id); };
  // A swipe carousel (pointer events) with no buttons.
  function swiper(box, track) {
    var n = 0, sx = null;
    box.addEventListener('pointerdown', function (e) { sx = e.clientX; });
    box.addEventListener('pointerup', function (e) { if (sx === null) return; var dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) { n = Math.max(0, Math.min(2, n + (dx < 0 ? 1 : -1))); track.style.transform = 'translateX(' + (-600 * n) + 'px)'; } });
    return function (k) { n = k; track.style.transform = 'translateX(' + (-600 * n) + 'px)'; };
  }
  swiper($('swipe-only'), $('t1'));
  var go = swiper($('swipe-ok'), $('t2'));
  document.querySelectorAll('.dot').forEach(function (b) { b.addEventListener('click', function () { go(+b.dataset.n); }); });
  // Two-finger pinch zoom (touch events), no buttons.
  var pinch = null, zoom = 1;
  var dist = function (t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); };
  $('pinch-only').addEventListener('touchstart', function (e) { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zoom }; });
  $('pinch-only').addEventListener('touchmove', function (e) { if (pinch && e.touches.length === 2) { zoom = pinch.z * dist(e.touches) / pinch.d; $('pic').style.transform = 'scale(' + zoom + ')'; } });
  $('pinch-only').addEventListener('touchend', function () { pinch = null; });
</script>
</body>
</html>
