<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pointer gestures: links and remove buttons in the way</title>
<style>body{font:16px/1.5 sans-serif;margin:20px}.car{position:relative;width:600px;height:200px;overflow:hidden;border:1px solid #333}.track{display:flex;width:1800px;height:200px}.slide{width:600px;height:200px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}.s1{background:#fde}.s2{background:#dfe}.s3{background:#def}.sortlist{list-style:none;padding:0;width:400px}.sortlist li{border:1px solid #333;margin:4px 0;padding:0;background:#f8f8f8;position:relative;height:40px}.sortlist li span{position:absolute;left:8px;top:8px}.sortlist li button{position:absolute;inset:0;width:100%;height:100%;opacity:.15}</style>
</head>
<body><main><h1>Stories</h1>
<div class="car" id="car"><div class="track" id="t">
<a class="slide s1" href="/news/1.html">Story one</a><a class="slide s2" href="/news/2.html">Story two</a><a class="slide s3" href="/news/3.html">Story three</a>
</div></div>
<h2>Your list</h2>
<ul class="sortlist" id="list">
  <li draggable="true"><span>Math</span><button type="button">Remove</button></li>
  <li draggable="true"><span>Reading</span><button type="button">Remove</button></li>
  <li draggable="true"><span>Science</span><button type="button">Remove</button></li>
</ul>
</main>
<script>
  var n = 0, sx = null, t = document.getElementById('t'), car = document.getElementById('car');
  car.addEventListener('pointerdown', function (e) { sx = e.clientX; });
  car.addEventListener('pointerup', function (e) { if (sx !== null && e.clientX - sx < -50) { n = Math.min(2, n + 1); t.style.transform = 'translateX(' + (-600 * n) + 'px)'; } sx = null; });
  var list = document.getElementById('list'), dragged = null;
  list.addEventListener('dragstart', function (e) { dragged = e.target.closest('li'); });
  list.addEventListener('dragover', function (e) { e.preventDefault(); });
  list.addEventListener('drop', function (e) { e.preventDefault(); var li = e.target.closest('li'); if (dragged && li && li !== dragged) li.after(dragged); dragged = null; });
  // Dropping onto a Remove button removes its item and tells the server.
  list.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('drop', function (e) { e.stopPropagation(); e.preventDefault(); fetch('/api/remove').catch(function () {}); b.closest('li').remove(); location.href = '/removed'; });
    b.addEventListener('dragover', function (e) { e.preventDefault(); });
  });
</script>
</body>
</html>
