<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members</title>
<style>
body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #222; background: #fff; }
main { padding: 16px 24px; }
label { display: block; margin: 8px 0; }
input { border: 2px solid #595959; padding: 4px; font: inherit; }
#bg { position: fixed; inset: 0; background: #000; opacity: 0.7; z-index: 10; }
#dlg { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); width: 360px; background: #fff; padding: 16px; z-index: 11; }
</style>
</head>
<body>
<!-- Sol popup-r1, 1: a log-in dialog with a sum to solve; closing it shows an ordinary log-in with no such test. The page
     behind is inert. Judged as one page, the plain log-in is the other way to sign in: no 3.3.8 failure. -->
<div id="page" inert aria-hidden="true">
<main>
  <h1>Members</h1>
  <p>Sign in to see your bookings and renew your membership. Members can book rooms and classes online.</p>
  <form action="/login" method="post">
    <label>Email <input type="email" name="email" autocomplete="email"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</main>
</div>
<div id="bg"></div>
<div id="dlg" role="dialog" aria-modal="true" aria-label="Quick sign-in">
  <form action="/quick-login" method="post">
    <label>Email <input type="email" name="email" autocomplete="email"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <p>Prove you are human: what is 3 + 4?</p>
    <label>Answer <input type="text" name="answer"></label>
    <button type="submit">Sign in</button>
  </form>
  <button type="button" id="x">Close</button>
</div>
<script>
document.getElementById('x').addEventListener('click', () => {
  document.getElementById('dlg').remove();
  document.getElementById('bg').remove();
  document.getElementById('page').removeAttribute('inert');
  document.getElementById('page').removeAttribute('aria-hidden');
});
</script>
</body>
</html>
