<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Library fees</title></head>
<body>
<main>
<h1>Library fees</h1>
<!-- Planted failure (1.3.1): the "Due" column header has no cells under it (each row stops after its first cell). -->
<table id="fees">
  <caption>Late fees</caption>
  <thead><tr><th>Item</th><th id="due-head">Due</th></tr></thead>
  <tbody><tr><td>Book</td></tr><tr><td>DVD</td></tr></tbody>
</table>
<!-- Clean: a header row, a column of row headers under a corner label, and data cells. -->
<table id="hours">
  <caption>Opening hours</caption>
  <tr><th>Branch</th><th>Weekdays</th><th>Saturday</th></tr>
  <tr><th>Main</th><td>9–5</td><td>10–2</td></tr>
  <tr><th>North</th><td>10–6</td><td>Closed</td></tr>
</table>
</main>
</body>
</html>
