<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixed boxes</title>
<style>body { margin: 0; font: 16px/1.4 sans-serif; color: #1a1a1a; } main { padding: 1rem; } .gap { height: 1000px; }
#clip-box { font-size: 16px; line-height: 20px; white-space: nowrap; width: 18rem; height: 60px; overflow: hidden; background: #ffff00; }</style></head>
<body><main>
  <h1>Text spacing</h1>
  <div class="gap"></div>
  <div id="clip-box">Spring concert<br>Thursday at 7 pm<br>Main gym doors open at 6</div>
  <div class="gap"></div>
</main></body>
</html>
