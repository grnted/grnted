<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A paragraph marked up as a heading far down</title>
<style>body { margin: 0; font: 16px/1.5 Arial, sans-serif; } main { padding: 16px 24px; } .gap { height: 1400px; }
.para { background: #ff00ff; width: 400px; margin: 0; font-size: 16px; font-weight: normal; }</style></head>
<body><main>
  <h1>Headings</h1>
  <h2>Opening hours</h2>
  <div class="gap"></div>
  <h2 class="para" id="far-para">The office is open on weekdays from eight in the morning until five in the evening. On public holidays it stays closed, and the phone line takes messages that are answered the next working day by a member of staff.</h2>
  <div class="gap"></div>
</main></body>
</html>
