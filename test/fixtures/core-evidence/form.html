<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up</title>
<style>body { margin: 0; font: 16px/1.5 Arial, sans-serif; } main { padding: 16px 24px; } .gap { height: 1100px; }
#ph { background: #00ffff; border: 2px solid #000; width: 300px; height: 32px; font: inherit; }</style></head>
<body><main>
  <h1>Sign up</h1>
  <div class="gap"></div>
  <form action="/signup" method="post">
    <p><input id="ph" name="email" type="email" placeholder="Your email"></p>
    <p><label for="nm">Name</label> <input id="nm" name="name"></p>
    <button type="submit">Sign up</button>
  </form>
</main></body>
</html>
