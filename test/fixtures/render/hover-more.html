<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render fixture: content on focus</title>
<style>
  body { margin: 0; font: 1rem/1.4 sans-serif; color: #1a1a1a; background: #fff; }
  main { padding: 1rem; max-width: 40rem; }
  .field { position: relative; }
  #email-hint { position: absolute; top: 100%; left: 0; width: 20rem; padding: 0.5rem; background: #1a1a1a; color: #fff; z-index: 2; }
  #email-hint[hidden] { display: none; }
  input { font: inherit; }
  /* A tooltip shown in empty space to the right of its trigger: it covers nothing, so it may stay until the pointer leaves. */
  .aside { position: relative; display: inline-block; }
  .aside .note { display: none; position: absolute; left: 100%; top: 0; width: 10rem; background: #1a1a1a; color: #fff; padding: 0.25rem; }
  .aside:hover .note { display: block; }
</style>
</head>
<body>
<main>
  <h1>Newsletter</h1>
  <form action="/newsletter" method="post">
    <div class="field">
      <label for="email">Email address</label><br>
      <input id="email" type="email" aria-describedby="email-hint">
      <div id="email-hint" hidden>We send one email a week, on Friday afternoon.</div>
    </div>
    <p>This paragraph is under the hint, which covers it while the field has focus. The hint has no Escape key handler.</p>
  </form>
  <p><span class="aside" id="aside">Why?<span class="note">Families asked for it.</span></span></p>
</main>
<script>
  (function () {
    var email = document.getElementById('email');
    var hint = document.getElementById('email-hint');
    email.addEventListener('focus', function () { hint.hidden = false; });
    email.addEventListener('blur', function () { hint.hidden = true; });
  })();
</script>
</body>
</html>
