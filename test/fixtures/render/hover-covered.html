<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render fixture: a trigger the pointer cannot reach</title>
<style>
  body { margin: 0; font: 1rem/1.4 sans-serif; color: #1a1a1a; background: #fff; }
  main { padding: 1rem; }
  #tip { position: absolute; background: #1a1a1a; color: #fff; padding: 0.5rem; }
  #tip[hidden] { display: none; }
  /* A full-screen layer (like a consent banner backdrop) over the whole page. */
  #layer { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.01); z-index: 10; }
</style>
</head>
<body>
<main>
  <h1>Library hours</h1>
  <p><button type="button" id="hours">Summer hours</button></p>
  <div id="tip" hidden>Open Tuesday and Thursday, 10 am to 2 pm.</div>
</main>
<div id="layer"></div>
<script>
  (function () {
    var btn = document.getElementById('hours');
    var tip = document.getElementById('tip');
    btn.addEventListener('mouseenter', function () { tip.hidden = false; });
    btn.addEventListener('mouseleave', function () { tip.hidden = true; });
  })();
</script>
</body>
</html>
