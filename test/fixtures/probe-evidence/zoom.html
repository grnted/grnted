<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe evidence fixture: text that zoom does not enlarge</title>
<style>
  body { margin: 0; font: 1rem/1.4 sans-serif; color: #1a1a1a; background: #fff; }
  main { padding: 16px; }
  /* Planted failure (1.4.4): a heading sized in viewport units stays the same size on screen at 200% zoom. */
  #vw-title { font-size: 4vw; margin: 0 0 16px; }
</style>
</head>
<body>
<main>
  <h1 id="vw-title">Viewport units</h1>
  <p>Body text in rem grows with browser zoom.</p>
</main>
</body>
</html>
