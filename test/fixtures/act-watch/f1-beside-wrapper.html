<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Permit request</title>
<style>body { font: 16px/1.5 sans-serif; margin: 24px; } label { display: block; margin-top: 10px; } .bad { border: 2px solid #b00020; } .err { color: #a00000; } .toast { position: fixed; right: 12px; bottom: 12px; background: #223; color: #fff; padding: 8px 12px; } .hidden { display: none; }</style></head>
<body>
<main><h1>Permit request</h1>
<form id="p" novalidate>
<div class="control"><label for="nm">Your name</label><input id="nm"></div><p class="err" id="nm-e"></p>
<div class="control"><label for="em">Email address</label><input id="em" type="email"></div><p class="err" id="em-e"></p>
<p><button type="submit">Apply</button></p><p id="done" role="status"></p></form>
</main>

<script>

const say = { nm: 'Enter your name', em: 'Enter an email address like name@example.com' };
document.getElementById('p').addEventListener('submit', (e) => { e.preventDefault(); let all = true;
  for (const id of ['nm', 'em']) { const f = document.getElementById(id); const v = f.value.trim();
    const ok = v !== '' && (id !== 'em' || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v));
    f.classList.toggle('bad', !ok); document.getElementById(id + '-e').textContent = ok ? '' : say[id]; all = all && ok; }
  document.getElementById('done').textContent = all ? 'Application received.' : ''; });
</script>
</body></html>
