<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} </style></head>
<body><main><h1>Sign in</h1><form id="l"><label for="u">User name</label><input id="u" name="username" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" name="pw" autocomplete="current-password"><p><button>Sign in</button></p></form></main><script>document.getElementById('u').addEventListener('input',e=>{const t=e.target.value.trim();if(t!==e.target.value)e.target.value=t;});</script></body></html>
