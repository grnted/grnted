<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Find a program</title><style>body{font:16px Arial;margin:24px} label{display:block} select,input{font:inherit}</style></head>
<body><main><h1>Find a program</h1><div class="filters"><label for="cat">Category</label><select id="cat"><option value="">All</option><option value="pool">Pool</option><option value="art">Art</option></select></div><p id="count" role="status">Showing 4 of 4 programs</p><ul id="list"><li data-c="pool">Swim lessons</li><li data-c="art">Painting</li><li data-c="pool">Water aerobics</li><li data-c="art">Pottery</li></ul></main><script>const s=document.getElementById('cat');s.addEventListener('change',()=>{let n=0;document.querySelectorAll('#list li').forEach(li=>{const on=!s.value||li.dataset.c===s.value;li.hidden=!on;if(on)n++;});document.getElementById('count').textContent='Showing '+n+' of 4 programs';});</script></body></html>
