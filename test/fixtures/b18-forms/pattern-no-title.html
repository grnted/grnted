<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Permit lookup</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} </style></head>
<body><main><h1>Permit lookup</h1><form id="p"><label for="pn">Your name</label><input id="pn" name="pn" autocomplete="name" required><label for="pc">Parcel</label><input id="pc" name="parcel" pattern="[0-9]{3}-[0-9]{3}" required><p><button>Look up</button></p><p id="r" role="status"></p></form></main><script>document.getElementById('p').addEventListener('submit',e=>{e.preventDefault();document.getElementById('r').textContent='Parcel found.';});</script></body></html>
