<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Permit application</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} </style></head>
<body><main><h1>Permit application</h1><form id="one" class="local"><label for="nm">Applicant name</label><input id="nm" name="applicant" autocomplete="name" required><label for="em">Email for your review</label><input id="em" type="email" name="email" autocomplete="email" required><p><button type="submit">Build application summary</button></p></form><section id="two" hidden><h2>Decision letter</h2><form id="c"><label for="d">Email for the decision letter</label><input id="d" type="email" name="letter" autocomplete="off" list="prev" required><datalist id="prev"></datalist><p><button type="submit">Finish review</button></p></form></section><section><button type="button" aria-expanded="false" aria-controls="help" id="ht">Show drawing instructions</button><p id="help" hidden>Bring one plan set.</p></section></main><script>document.getElementById('one').addEventListener('submit',e=>{e.preventDefault();e.target.hidden=true;document.getElementById('two').hidden=false;const o=document.createElement('option');o.value=document.getElementById('em').value;document.getElementById('prev').append(o);});document.getElementById('ht').addEventListener('click',()=>{const h=document.getElementById('help');h.hidden=!h.hidden;});</script></body></html>
