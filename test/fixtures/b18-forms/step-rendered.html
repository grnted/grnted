<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room request</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} </style></head>
<body><main><h1>Room request</h1><form id="w"><div id="body"><h2>1. Contact</h2><label for="ce">Contact email</label><input id="ce" type="email" name="ce" autocomplete="email"><label for="gp">Group name</label><input id="gp" name="group"></div><p><button type="button" id="go">Save and continue</button></p></form></main><script>document.getElementById('go').addEventListener('click',()=>{if(!document.getElementById('ce').value)return;document.getElementById('body').innerHTML='<h2>2. Room details</h2><label for=re>Email for the booking letter</label><input id=re type=email name=re autocomplete=off><label for=pu>How will you use the room?</label><textarea id=pu name=pu></textarea>';document.getElementById('go').textContent='Review request';});</script></body></html>
