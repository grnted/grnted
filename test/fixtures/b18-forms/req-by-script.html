<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library card</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} </style></head>
<body><main><h1>Library card</h1><form id="card" novalidate><label for="a">Full name</label><input id="a" name="applicant"><label for="s">Street address</label><input id="s" name="street"><label for="t">Town</label><input id="t" name="town"><p><button>Start application</button></p><p id="r" role="status"></p></form></main><script>document.getElementById('card').addEventListener('submit',e=>{e.preventDefault();const need=[...e.target.querySelectorAll('input')].filter(i=>!i.value.trim()&&!/optional/i.test(i.labels[0].textContent));document.getElementById('r').textContent=need.length?'Enter your '+need.map(i=>i.labels[0].textContent.replace(' (optional)','').toLowerCase()).join(', ')+' to continue.':'Your application has been started.';});</script></body></html>
