<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .if{position:relative;margin-top:12px}.if label{position:absolute;left:8px;top:6px;margin:0;color:#444}</style></head>
<body><main><h1>Contact</h1><form id="c6" novalidate><div class="if"><label for="n">Your name</label><input id="n" name="n" autocomplete="name"></div><div class="if"><label for="t">Topic</label><input id="t" name="t"></div><p><button>Send</button></p></form></main><script>document.querySelectorAll('.if input').forEach(i=>{const l=i.previousElementSibling;const u=()=>{l.style.display=i.value?'none':'';};i.addEventListener('input',u);i.addEventListener('change',u);});</script></body></html>
