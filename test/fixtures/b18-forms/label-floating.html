<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .fl{position:relative;margin-top:24px}.fl label{position:absolute;left:8px;top:6px;transition:all .1s;margin:0}.fl input:focus+label,.fl input:not(:placeholder-shown)+label,.fl textarea:focus+label,.fl textarea:not(:placeholder-shown)+label{top:-20px;font-size:13px}</style></head>
<body><main><h1>Newsletter</h1><form id="c5"><div class="fl"><input id="n" name="n" placeholder=" " autocomplete="name"><label for="n">Your name</label></div><div class="fl"><textarea id="m" name="m" placeholder=" "></textarea><label for="m">Message</label></div><p><button>Send</button></p></form></main></body></html>
