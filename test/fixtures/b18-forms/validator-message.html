<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Records request</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} </style></head>
<body><main><h1>Records request</h1><form id="v" novalidate><label for="n">Your name</label><input id="n" name="n" autocomplete="name" aria-describedby="n-err"> <span id="n-err" style="color:#b00000;visibility:hidden">Enter your name</span><label for="em">Email</label><input id="em" type="email" name="em" autocomplete="email" aria-describedby="em-err"> <span id="em-err" style="color:#b00000;visibility:hidden">Enter an email address like name@example.com</span><p><button>Send request</button></p><p id="done" role="status"></p></form></main><script>document.getElementById('v').addEventListener('submit',e=>{e.preventDefault();let bad=false;document.querySelectorAll('#v input').forEach(i=>{const s=document.getElementById(i.id+'-err');const ok=i.value.trim()&&(i.type!=='email'||i.value.includes('@'));s.style.visibility=ok?'hidden':'visible';if(!ok)bad=true;});if(!bad)document.getElementById('done').textContent='Request saved.';});</script></body></html>
