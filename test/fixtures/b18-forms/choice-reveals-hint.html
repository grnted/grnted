<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Account type</title><style>body{font:16px Arial;margin:24px} label{display:block} select,input{font:inherit}</style></head>
<body><main><h1>Account type</h1><form id="t"><label for="ty">Account type</label><select id="ty"><option value="h">Household</option><option value="b">Business</option></select><p id="bh" hidden>Business accounts are available on weekdays.</p><p><button>Continue</button></p></form></main><script>document.getElementById('ty').addEventListener('change',e=>{document.getElementById('bh').hidden=e.target.value!=='b';});</script></body></html>
