<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request a callback</title>
<style>body{font:16px/1.5 Arial,sans-serif;margin:24px;color:#1b1b1b;background:#fff} label{display:block;margin-top:12px} input,select,button,textarea{font:inherit;padding:4px;border:2px solid #1b1b1b} .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style></head>
<body><main><h1>Request a callback</h1><form id="f" novalidate><label for="n">Your name</label><input id="n" name="n" autocomplete="name"><label for="t">Topic</label><input id="t" name="topic"><p><button type="submit">Send request</button></p></form><p id="s" role="status"></p></main><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('s').textContent='Your request was saved.';});</script></body></html>
